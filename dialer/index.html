<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#12A150" />
<title>Dial Sheet</title>
<style>
:root{
  --ground:#EAEDE8; --surface:#FFFFFF; --surface-2:#F2F5F1; --sunk:#E1E6DF;
  --line:#D5DCD4; --line-soft:#E4E9E3;
  --ink:#141915; --ink-2:#46514A; --muted:#76847B;
  --dial:#12A150; --dial-press:#0C8341; --on-dial:#FFFFFF;
  --pine:#0E7A4A; --clay:#C2683A; --brick:#A33A3A; --slate:#5E7268; --dusk:#5A6B86;
  --shadow:0 1px 2px rgba(20,25,21,.06), 0 8px 24px rgba(20,25,21,.07);
  --sheet-shadow:0 -8px 40px rgba(20,25,21,.22);
  --r:14px; --r-sm:9px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F120F; --surface:#171B18; --surface-2:#1D221E; --sunk:#0A0D0A;
    --line:#2A312C; --line-soft:#232A25;
    --ink:#E7ECE6; --ink-2:#AFBCB2; --muted:#7E8D83;
    --dial:#25C06A; --dial-press:#1DA85B; --on-dial:#06210F;
    --pine:#46C68C; --clay:#DE9061; --brick:#D97676; --slate:#8FA396; --dusk:#93A8C6;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --sheet-shadow:0 -8px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0F120F; --surface:#171B18; --surface-2:#1D221E; --sunk:#0A0D0A;
  --line:#2A312C; --line-soft:#232A25;
  --ink:#E7ECE6; --ink-2:#AFBCB2; --muted:#7E8D83;
  --dial:#25C06A; --dial-press:#1DA85B; --on-dial:#06210F;
  --pine:#46C68C; --clay:#DE9061; --brick:#D97676; --slate:#8FA396; --dusk:#93A8C6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --sheet-shadow:0 -8px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent; overflow-wrap:break-word;
}
button,input,select,textarea{font:inherit;color:inherit}
input[type="checkbox"]{accent-color:var(--dial)}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--dial); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- app shell ---------- */
.app{max-width:720px;margin:0 auto;padding:0 0 96px}
.topbar{
  position:sticky; top:0; z-index:30; background:var(--ground);
  padding:max(10px,env(safe-area-inset-top)) 14px 8px; border-bottom:1px solid var(--line-soft);
}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--dial);display:grid;place-items:center;flex:none}
.mark svg{width:15px;height:15px;fill:var(--on-dial)}
.brand{font-size:17px;font-weight:680;letter-spacing:-.01em;margin:0}
.brandrow .spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line-soft)}
.iconbtn.sync{position:relative}
.iconbtn.sync .dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--muted);border:1.5px solid var(--ground);display:none}
.iconbtn.sync[data-s] .dot{display:block}
.iconbtn.sync[data-s="ok"] .dot{background:var(--pine)}
.iconbtn.sync[data-s="pending"] .dot{background:var(--clay)}
.iconbtn.sync[data-s="error"] .dot{background:var(--brick)}
.iconbtn.sync[data-s="busy"] svg{animation:spin 1s linear infinite}
.iconbtn.sync[data-s="busy"] .dot{background:var(--dial)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.iconbtn.sync[data-s="busy"] svg{animation:none}}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:7px 10px}
.stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.due b{color:var(--clay)}
.stat.pipe b{color:var(--pine)}

.searchwrap{position:relative;margin-bottom:9px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;pointer-events:none}
#q{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
#q::placeholder{color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:560;color:var(--ink-2);white-space:nowrap;
}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--ground);opacity:.65}

.toolbar{display:flex;gap:7px;padding:10px 14px 4px;flex-wrap:wrap}
.tool{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:580;color:var(--ink-2);
}
.tool:hover{border-color:var(--muted)}
.tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.go{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- lead list ---------- */
.list{padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.lead{
  display:flex;align-items:stretch;gap:10px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;position:relative;
}
.lead::before{content:"";width:3px;flex:none;background:var(--st,transparent)}
.lead.due::after{content:"";position:absolute;top:9px;right:78px;width:6px;height:6px;border-radius:50%;background:var(--clay)}
.leadbody{flex:1;min-width:0;padding:11px 4px 11px 8px;text-align:left;display:block}
.lname{font-size:16px;font-weight:640;letter-spacing:-.01em;line-height:1.25;margin:0 0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmeta{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.lmeta .sep{color:var(--line);margin:0 5px}
.lsub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.lsub .last{overflow:hidden;text-overflow:ellipsis}
.lsub .val{color:var(--pine);font-weight:640}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:640;letter-spacing:.03em;
  text-transform:uppercase;color:var(--st,var(--muted))}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.dialbtn{
  flex:none;width:74px;background:var(--surface-2);border-left:1px solid var(--line-soft);
  display:grid;place-items:center;text-decoration:none;color:inherit;
}
.dialbtn .circle{
  width:48px;height:48px;border-radius:50%;background:var(--dial);display:grid;place-items:center;
  box-shadow:0 2px 8px color-mix(in srgb, var(--dial) 40%, transparent);transition:transform .12s ease,background .12s ease;
}
.dialbtn:active .circle{transform:scale(.92);background:var(--dial-press)}
.dialbtn svg{width:21px;height:21px;fill:var(--on-dial)}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--read);font-size:21px;font-weight:400;color:var(--ink);margin:0 0 8px}
.empty p{font-size:14px;margin:0 auto;max-width:34ch;line-height:1.6}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);
  max-width:720px;margin:0 auto;max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheethead{padding:10px 16px 8px;border-bottom:1px solid var(--line-soft);flex:none}
.sheethead h2{margin:0;font-size:19px;font-weight:660;letter-spacing:-.015em;line-height:1.25}
.sheethead .who{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.callrow{display:flex;align-items:center;gap:10px;margin-top:9px}
.callrow a.num{font-family:var(--mono);font-size:15px;color:var(--pine);text-decoration:none;font-weight:600}
.timer{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.timer .live{width:7px;height:7px;border-radius:50%;background:var(--dial);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.timer .live{animation:none}}
.tabs{display:flex;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--line-soft);flex:none}
.tab{padding:8px 12px 9px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--dial)}
.panes{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane{padding:14px 16px 8px}
.script{font-family:var(--read);font-size:var(--sfs,18px);line-height:1.62;color:var(--ink);white-space:pre-wrap}
.script mark{background:color-mix(in srgb,var(--dial) 20%,transparent);color:inherit;border-radius:3px;padding:0 2px;font-weight:600;font-family:var(--ui);font-size:.94em}
.scriptbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.scriptbar select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;max-width:55%}
.szbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px;display:grid;place-items:center;color:var(--ink-2)}
#notes{width:100%;min-height:190px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical;font-size:16px;line-height:1.5}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{padding:5px 10px;border:1px dashed var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.quick button:hover{border-style:solid;color:var(--ink)}
.fields{display:grid;gap:10px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:660;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{display:flex;flex-direction:column;gap:0}
.logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.logitem:last-child{border-bottom:0}
.logitem .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:82px;flex:none;padding-top:2px}
.logitem .what{flex:1;min-width:0;font-size:14px}
.logitem .what b{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--st,var(--ink-2))}
.logitem .what p{margin:3px 0 0;color:var(--ink-2);white-space:pre-wrap;font-size:13.5px}

.outcomes{padding:12px 16px;border-top:1px solid var(--line-soft);background:var(--surface);flex:none}
.olabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:660;margin-bottom:7px}
.outcomes{padding:10px 16px 11px}
.ogrid{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.ogrid::-webkit-scrollbar{display:none}
.o{flex:none;padding:9px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:620;color:var(--ink-2);white-space:nowrap;line-height:1.2}
.o[aria-pressed="true"]{background:var(--oc);border-color:var(--oc);color:#fff}
.sheetfoot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);flex:none}
.btn{flex:1;padding:13px 10px;border-radius:12px;font-size:14.5px;font-weight:660;text-align:center;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.dial{background:var(--dial);color:var(--on-dial);border-color:var(--dial);text-decoration:none;display:grid;place-items:center}

/* ---------- modal (import / add / scripts / settings) ---------- */
.modal{
  position:fixed;inset:auto 0 0;z-index:50;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:var(--sheet-shadow);max-width:720px;margin:0 auto;max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.modal.on{transform:translateY(0)}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex:none}
.mhead h2{margin:0;font-size:17px;font-weight:660;flex:1;letter-spacing:-.01em}
.mbody{padding:14px 16px;overflow-y:auto;flex:1}
.mfoot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);flex:none}
.help{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 12px}
.help code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:12px}
.drop.over{border-color:var(--dial);color:var(--pine);background:color-mix(in srgb,var(--dial) 7%,transparent)}
.drop b{color:var(--ink);font-size:14px;display:block;margin-bottom:3px}
textarea.paste{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;resize:vertical;line-height:1.5}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.maprow .src{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px}
.preview{font-size:12.5px;color:var(--muted);margin-top:10px;font-family:var(--mono);line-height:1.6}
.slist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.srow{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface-2)}
.srow .nm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .mini{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:7px}
.tokens{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
.tokens button{font-family:var(--mono);font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);background:var(--surface-2)}
.danger{color:var(--brick)}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:560;
  z-index:80;opacity:0;pointer-events:none;transition:all .2s ease;max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 1.9c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .7-.2 1L6.6 10.8z"/></svg></span>
      <h1 class="brand">Dial Sheet</h1>
      <span class="spacer"></span>
      <button class="iconbtn sync" id="btnSync" title="Sync with Google Sheet" aria-label="Sync with Google Sheet"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4"/><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4"/><path d="M19.5 3v4h-4"/><path d="M4.5 21v-4h4"/></svg><span class="dot"></span></button>
      <button class="iconbtn" id="btnScripts" title="Scripts" aria-label="Scripts"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h5"/></svg></button>
      <button class="iconbtn" id="btnSettings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </div>

    <div class="stats">
      <div class="stat"><b class="mono" id="sCalls">0</b><span>Dialed today</span></div>
      <div class="stat"><b class="mono" id="sConn">0</b><span>Connects</span></div>
      <div class="stat due"><b class="mono" id="sDue">0</b><span>Due now</span></div>
      <div class="stat pipe"><b class="mono" id="sPipe">$0</b><span>Pipeline</span></div>
    </div>

    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, owner, metro, number" autocomplete="off" />
    </div>

    <div class="chips" id="filters"></div>
  </header>

  <div class="toolbar">
    <button class="tool go" id="btnNext"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z" fill="currentColor" stroke="none"/><path d="M19 4v16"/></svg> Start calling</button>

  <main class="list" id="list"></main>
</div>

        <button class="szbtn" id="szDown" aria-label="Smaller text">A−</button>
        <button class="szbtn" id="szUp" aria-label="Larger text">A+</button>

      <textarea id="notes" placeholder="What happened on this call?"></textarea>

<section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
  <div class="grab"></div>
  <div class="mhead">
    <h2 id="mTitle">—</h2>
    <button class="iconbtn" id="mClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept=".csv,.txt,text/csv,text/plain" class="hide" />

<script>
(function(){
"use strict";

/* ============================== storage ============================== */
const KEY = "dialsheet.v1";
const uid = () => Math.random().toString(36).slice(2,10);

const DEFAULT_SCRIPT = `Hi, is this {{owner}}?

Hey {{owner}}, this is {{me}} with {{company}} — I'll be quick. I'm calling local {{metro}} businesses, and {{business}} came up on my list.

The reason for the call: {{offer}}

[PAUSE — let them react]

Is that something you handle, or is there someone else there who does?

— IF INTERESTED —
Great. Two quick questions so I don't waste your time:
1. How are you getting new customers right now?
2. What would another 5–10 jobs a month actually be worth to you?

Sounds like it's worth 15 minutes. I've got Tuesday morning or Thursday afternoon — which is easier?

— IF "SEND ME SOMETHING" —
Happy to. What's the best email? … And so I send the right thing, what's the one part you'd want to see first?

— IF "NOT INTERESTED" —
Totally fair. Before I let you go — is it that you're covered right now, or just bad timing?

— IF GATEKEEPER —
No problem — when's {{owner}} usually around? I'll call back then rather than bug you.

CLOSE: Appreciate the time, {{owner}}. Talk soon.`;

const SAMPLE = [
  {business:"Ridgeline Heating & Air", owner:"Dave Kowalski", metro:"Phoenix, AZ",   location:"Mesa",        phone:"+16025550142", email:"dave@ridgelinehvac.com",   status:"new"},
  {business:"Copper State Roofing",    owner:"Maria Delgado", metro:"Phoenix, AZ",   location:"Chandler",    phone:"+16025550178", email:"office@copperstateroof.com",status:"callback", followAt:"", note:"Wants a call back after 4pm — busy on a job site."},
  {business:"Northside Dental Studio", owner:"Dr. Amy Chen",  metro:"Denver, CO",    location:"Thornton",    phone:"+13035550119", email:"frontdesk@northsidedental.com", value:6000, status:"interested", note:"Asked for pricing. Wants to see case studies for dental."},
  {business:"Bluegrass Lawn Pros",     owner:"Travis Boone",  metro:"Louisville, KY",location:"Jeffersontown",phone:"+15025550166",email:"travis@bluegrasslawn.com", status:"voicemail"},
  {business:"Harbor Point Plumbing",   owner:"Sean Whitfield",metro:"Tampa, FL",     location:"Clearwater",  phone:"+18135550133", email:"sean@harborpointplumbing.com", status:"new"},
  {business:"Vega Auto Glass",         owner:"Luis Vega",     metro:"San Antonio, TX",location:"Alamo Heights",phone:"+12105550107",email:"luis@vegaautoglass.com",  status:"noanswer"},
  {business:"Summit Ridge Fitness",    owner:"Kaitlyn Pierce",metro:"Salt Lake City, UT",location:"Sandy",   phone:"+18015550190", email:"kaitlyn@summitridgefit.com", value:9500, status:"meeting", note:"Thursday 2pm, wants the owner of the gym on the call too."},
  {business:"Old Mill Coffee Roasters",owner:"Priya Raman",   metro:"Portland, OR",  location:"Beaverton",   phone:"+15035550124", email:"priya@oldmillroasters.com", status:"new"}
];

const STATUS = {
  new:        {label:"New",            color:"var(--slate)"},
  callback:   {label:"Callback",       color:"var(--clay)"},
  interested: {label:"Interested",     color:"var(--pine)"},
  meeting:    {label:"Meeting set",    color:"var(--pine)"},
  voicemail:  {label:"Voicemail",      color:"var(--dusk)"},
  noanswer:   {label:"No answer",      color:"var(--slate)"},
  no:         {label:"Not interested", color:"var(--brick)"},
  bad:        {label:"Bad number",     color:"var(--brick)"},
  dnc:        {label:"Do not call",    color:"var(--brick)"}
};
const OUTCOMES = ["interested","meeting","callback","voicemail","noanswer","no","bad","dnc"];
const CLOSED = ["no","bad","dnc","meeting"];

let db = load();

function blank(){
  return {
    v:1,
    leads: SAMPLE.map(s => mkLead(Object.assign({sample:true}, s))),
    scripts: [{id:uid(), name:"Cold call — local business", body:DEFAULT_SCRIPT}],
    deleted: [],
    settings: {me:"", company:"", offer:"we help local businesses get more inbound calls without spending more on ads",
      theme:"auto", scriptId:null, scriptSize:18,
      sheet:{url:"", token:"", auto:true, at:0, ids:[]}}
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    d.leads = (d.leads||[]).map(mkLead);
    if(!d.scripts || !d.scripts.length) d.scripts = blank().scripts;
    d.settings = Object.assign(blank().settings, d.settings||{});
    d.settings.sheet = Object.assign(blank().settings.sheet, d.settings.sheet||{});
    d.deleted = d.deleted || [];
    return d;
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast("Couldn't save — storage is full or blocked"); }
}
function mkLead(o){
  const l = Object.assign({
    id:uid(), business:"", owner:"", metro:"", location:"", phone:"", email:"", website:"",
    value:0, status:"new", followAt:"", calls:[], created:Date.now(), updated:0, sample:false
  }, o);
  if(o && o.note && !(l.calls||[]).length){
    l.calls = [{at:Date.now()-86400000, outcome:l.status, note:o.note}];
  }
  delete l.note;
  l.calls = l.calls || [];
  l.value = +l.value || 0;
  l.updated = +l.updated || Date.now();
  return l;
}

/* ============================== helpers ============================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function digits(s){ return String(s||"").replace(/[^\d+]/g,""); }
function normPhone(s){
  let d = String(s||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.length===11 && d[0]==="1") return "+"+d;
  if(d.length===10) return "+1"+d;
  if(String(s).trim().startsWith("+")) return "+"+d;
  return d.length>11 ? "+"+d : d;
}
function fmtPhone(p){
  const d = String(p||"").replace(/\D/g,"");
  if(d.length===11 && d[0]==="1") return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p||"";
}
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function isToday(ts){ if(!ts) return false; const d=new Date(ts); const n=new Date(); return d.toDateString()===n.toDateString(); }
function when(ts){
  const d = new Date(ts), n = new Date();
  const day = d.toDateString()===n.toDateString() ? "Today"
    : d.toDateString()===new Date(n-864e5).toDateString() ? "Yest"
    : d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return day+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function touch(l){ l.updated = Date.now(); return l; }
function lastCallAt(l){ return l.calls.length ? l.calls[l.calls.length-1].at : 0; }
function firstName(s){ return String(s||"").trim().split(/\s+/)[0] || ""; }
function parseMoney(s){ const n = parseFloat(String(s==null?"":s).replace(/[^0-9.]/g,"")); return isFinite(n) && n>0 ? n : 0; }
function money(n){
  n = +n || 0;
  if(n >= 1e6) return "$"+(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n >= 1e4) return "$"+(n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"k";
  return "$"+Math.round(n).toLocaleString();
}
const OPEN_VALUE = ["interested","meeting","callback"];

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2600);
}

/* ============================== list ============================== */
const FILTERS = [
  {id:"tocall",     label:"To call",     fn:l => !CLOSED.includes(l.status)},
  {id:"due",        label:"Follow-ups",  fn:l => l.followAt && l.followAt <= today()},
  {id:"interested", label:"Interested",  fn:l => l.status==="interested"},
  {id:"meeting",    label:"Meetings",    fn:l => l.status==="meeting"},
  {id:"uncalled",   label:"Never called",fn:l => !l.calls.length},
  {id:"all",        label:"All",         fn:() => true},
  {id:"closed",     label:"Closed",      fn:l => ["no","bad","dnc"].includes(l.status)}
];
let state = {filter:"tocall", q:"", leadId:null, callIdx:-1, tab:"script", timerT:null, sync:{busy:false, error:""}};

function visible(){
  const f = FILTERS.find(x=>x.id===state.filter) || FILTERS[0];
  const q = state.q.trim().toLowerCase();
  let out = db.leads.filter(f.fn);
  if(q){
    const qd = q.replace(/\D/g,"");
    out = out.filter(l =>
      (l.business+" "+l.owner+" "+l.metro+" "+l.location+" "+l.email).toLowerCase().includes(q) ||
      (qd && l.phone.replace(/\D/g,"").includes(qd))
    );
  }
  return out.sort(sortQueue);
}
function sortQueue(a,b){
  const rank = l => {
    if(l.followAt && l.followAt <= today()) return 0;
    if(!l.calls.length) return 1;
    if(CLOSED.includes(l.status)) return 4;
    if(l.status==="interested") return 2;
    return 3;
  };
  const r = rank(a)-rank(b);
  if(r) return r;
  if(a.followAt && b.followAt) return a.followAt < b.followAt ? -1 : 1;
  return lastCallAt(a)-lastCallAt(b);
}
function queue(){
  return db.leads.filter(l => !CLOSED.includes(l.status)).sort(sortQueue);
}

function renderFilters(){
  $("#filters").innerHTML = FILTERS.map(f => {
    const n = db.leads.filter(f.fn).length;
    return `<button class="chip" data-f="${f.id}" aria-pressed="${state.filter===f.id}">${esc(f.label)}<span class="n">${n}</span></button>`;
  }).join("");
}
function renderStats(){
  let calls=0, conn=0;
  db.leads.forEach(l => l.calls.forEach(c => {
    if(isToday(c.at)){ calls++; if(["interested","meeting","callback","no"].includes(c.outcome)) conn++; }
  }));
  $("#sCalls").textContent = calls;
  $("#sConn").textContent  = conn;
  $("#sDue").textContent   = db.leads.filter(l=>l.followAt && l.followAt<=today()).length;
  $("#sPipe").textContent  = money(db.leads.filter(l=>OPEN_VALUE.includes(l.status)).reduce((t,l)=>t+(+l.value||0),0));
}
function renderList(){
  const rows = visible();
  const el = $("#list");
  if(!rows.length){
    el.innerHTML = `<div class="empty"><h2>Nothing here yet</h2>
      <p>Import a CSV of businesses, or add one by hand. Tap the green circle to dial — the call sheet opens on its own.</p></div>`;
    return;
  }
  el.innerHTML = rows.map(l => {
    const st = STATUS[l.status] || STATUS.new;
    const due = l.followAt && l.followAt <= today();
    const meta = [l.owner, l.metro || l.location].filter(Boolean).map(esc).join('<span class="sep">/</span>');
    const last = due ? "due "+l.followAt : (l.calls.length ? when(lastCallAt(l)) : "");
    return `<article class="lead ${due?"due":""}" style="--st:${st.color}">
      <button class="leadbody" data-open="${l.id}">
        <h3 class="lname">${esc(l.business||"(no name)")}</h3>
        <div class="lmeta">${meta||"&nbsp;"}</div>
        <div class="lsub">
          <span class="tag"><span class="dot"></span>${esc(st.label)}</span>
          <span class="mono">${esc(fmtPhone(l.phone))}</span>
          ${l.value ? `<span class="val mono">${esc(money(l.value))}</span>` : ""}
          <span class="last">${esc(last)}</span>
        </div>
      </button>
      <a class="dialbtn" href="tel:${esc(l.phone)}" target="_blank" rel="noopener" data-dial="${l.id}" aria-label="Call ${esc(l.business)}">
        <span class="circle"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 1.9c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .7-.2 1L6.6 10.8z"/></svg></span>
      </a>
    </article>`;
  }).join("");
}
function render(){ renderFilters(); renderStats(); renderList(); paintSync(); }

/* ============================== call sheet ============================== */
const sheet = $("#sheet"), scrim = $("#scrim"), modal = $("#modal");

function activeLead(){ return db.leads.find(l => l.id === state.leadId); }

function openSheet(id, dialing){
  const l = db.leads.find(x=>x.id===id); if(!l) return;
  state.leadId = id; state.tab = "script"; state.callIdx = -1;
  if(dialing){
    l.calls.push({at:Date.now(), outcome:null, note:""});
    state.callIdx = l.calls.length-1;
    save();
  }
  fillSheet();
  sheet.hidden = false; modal.hidden = true;
  requestAnimationFrame(()=>{ sheet.classList.add("on"); scrim.classList.add("on"); });
  startTimer(dialing ? Date.now() : 0);
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  sheet.classList.remove("on"); scrim.classList.remove("on");
  document.body.style.overflow = "";
  clearInterval(state.timerT); state.timerT = null;
  setTimeout(()=>{ if(!sheet.classList.contains("on")) sheet.hidden = true; }, 300);
  state.leadId = null; state.callIdx = -1;
  render();
}
function startTimer(from){
  clearInterval(state.timerT);
  const el = $("#shTimer");
  if(!from){ el.innerHTML = ""; return; }
  const tick = () => {
    const s = Math.floor((Date.now()-from)/1000);
    el.innerHTML = `<span class="live"></span>${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  };
  tick(); state.timerT = setInterval(tick, 1000);
}
function fillSheet(){
  const l = activeLead(); if(!l) return;
  $("#shName").textContent = l.business || "(no name)";
  $("#shWho").textContent  = [l.owner, l.metro, l.location].filter(Boolean).join(" · ") || "—";
  $("#shTel").textContent  = fmtPhone(l.phone) || "no number";
  $("#shTel").href = "tel:"+l.phone;
  $("#btnRedial").href = "tel:"+l.phone;
  $("#logN").textContent = l.calls.length ? "("+l.calls.length+")" : "";
  // script
  const sel = $("#scriptPick");
  sel.innerHTML = db.scripts.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  sel.value = db.settings.scriptId && db.scripts.some(s=>s.id===db.settings.scriptId) ? db.settings.scriptId : db.scripts[0].id;
  db.settings.scriptId = sel.value;
  renderScript();
  // notes
  const call = state.callIdx>=0 ? l.calls[state.callIdx] : null;
  $("#notes").value = call ? call.note : "";
  // outcome buttons
  $("#ogrid").innerHTML = OUTCOMES.map(o=>{
    const st = STATUS[o];
    const on = call ? call.outcome===o : l.status===o;
    return `<button class="o" data-o="${o}" aria-pressed="${on}" style="--oc:${st.color}">${esc(st.label)}</button>`;
  }).join("");
  $("#followAt").value = l.followAt || "";
  $("#dealValue").value = l.value ? money(l.value) : "";
  const cur = call ? call.outcome : l.status;
  syncExtras(cur);
  renderInfo(); renderLog(); showTab(state.tab);
}
function tokens(l){
  const s = db.settings;
  return {
    business:l.business, owner:l.owner||"there", first:firstName(l.owner)||"there",
    metro:l.metro||l.location, location:l.location||l.metro, phone:fmtPhone(l.phone), email:l.email,
    me:s.me||"[your name]", company:s.company||"[your company]", offer:s.offer||"[your one-liner]"
  };
}
function renderScript(){
  const l = activeLead(); if(!l) return;
  const s = db.scripts.find(x=>x.id===db.settings.scriptId) || db.scripts[0];
  const t = tokens(l);
  const html = esc(s.body).replace(/\{\{\s*(\w+)\s*\}\}/g, (m,k)=>{
    const v = t[k.toLowerCase()];
    return v ? `<mark>${esc(v)}</mark>` : m;
  });
  const body = $("#scriptBody");
  body.innerHTML = html;
  body.style.setProperty("--sfs", (db.settings.scriptSize||18)+"px");
}
function renderInfo(){
  const l = activeLead(); if(!l) return;
  const f = (k,label,type) => `<div class="f"><label for="i_${k}">${label}</label><input id="i_${k}" data-k="${k}" type="${type||"text"}" value="${esc(l[k]||"")}" /></div>`;
  $("#infoFields").innerHTML =
    f("business","Business") + f("owner","Owner / contact") +
    `<div class="two">${f("phone","Phone","tel")}${f("email","Email","email")}</div>` +
    `<div class="two">${f("metro","Metro area")}${f("location","City / location")}</div>` +
    `<div class="two">${f("website","Website")}<div class="f"><label for="i_value">Quote / deal size</label><input id="i_value" data-k="value" type="text" inputmode="decimal" value="${l.value?esc(money(l.value)):""}" placeholder="$0" /></div></div>` +
    `<div class="two">
      <div class="f"><label for="i_status">Status</label><select id="i_status" data-k="status">${Object.keys(STATUS).map(k=>`<option value="${k}" ${l.status===k?"selected":""}>${STATUS[k].label}</option>`).join("")}</select></div>
      <div class="f"><label for="i_followAt">Follow up on</label><input id="i_followAt" data-k="followAt" type="date" value="${esc(l.followAt||"")}" /></div>
    </div>`;
}
function renderLog(){
  const l = activeLead(); if(!l) return;
  const items = l.calls.slice().reverse();
  $("#logBody").innerHTML = items.length ? items.map(c=>{
    const st = STATUS[c.outcome] || {label:"Dialed", color:"var(--muted)"};
    return `<div class="logitem"><div class="when">${esc(when(c.at))}</div>
      <div class="what" style="--st:${st.color}"><b>${esc(st.label)}</b>${c.note?`<p>${esc(c.note)}</p>`:""}</div></div>`;
  }).join("") : `<p class="help">No calls logged yet.</p>`;
}
function syncExtras(outcome){
  const cb = outcome === "callback";
  const val = outcome === "interested" || outcome === "meeting";
  $("#followWrap").classList.toggle("hide", !cb);
  $("#valueWrap").classList.toggle("hide", !val);
  $("#extraWrap").classList.toggle("hide", !cb && !val);
  return cb;
}
function showTab(name){
  state.tab = name;
  $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.pane===name)));
  $$(".pane").forEach(p => p.classList.toggle("hide", p.dataset.pane!==name));
}
function commit(){
  const l = activeLead(); if(!l) return;
  const note = $("#notes").value.trim();
  const picked = $("#ogrid").querySelector('[aria-pressed="true"]');

/* ============================== google sheet sync ============================== */
const STATUS_BY_LABEL = {};
Object.keys(STATUS).forEach(k => STATUS_BY_LABEL[STATUS[k].label.toLowerCase()] = k);
function statusKey(v){
  const t = String(v||"").trim().toLowerCase();
  return STATUS[t] ? t : (STATUS_BY_LABEL[t] || "new");
}
function iso(ms){ return ms ? new Date(ms).toISOString() : ""; }

function leadRow(l){
  const last = l.calls[l.calls.length-1];
  return {
    id:l.id, business:l.business, owner:l.owner, phone:l.phone, email:l.email,
    metro:l.metro, location:l.location, website:l.website, deal_value:l.value||0,
    status:(STATUS[l.status]||STATUS.new).label, follow_up:l.followAt||"",
    last_call:last?iso(last.at):"", calls:l.calls.length, notes:last?last.note:"",
    updated:iso(l.updated||Date.now())
  };
}
function logRow(l, c){
  return {when:iso(c.at), id:l.id, business:l.business, owner:l.owner, phone:l.phone,
          metro:l.metro, outcome:(STATUS[c.outcome]||{}).label||"Dialed",
          deal_value:l.value||0, note:c.note||""};
}
function applyRow(l, r){
  l.business = r.business||""; l.owner = r.owner||"";
  l.phone = normPhone(r.phone); l.email = r.email||"";
  l.metro = r.metro||""; l.location = r.location||""; l.website = r.website||"";
  l.value = parseMoney(r.deal_value); l.status = statusKey(r.status);
  l.followAt = String(r.follow_up||"").slice(0,10);
  return l;
}
function mergeRemote(rows){
  const cfg = db.settings.sheet;
  const byId = {}; db.leads.forEach(l => byId[l.id] = l);
  const seen = {};
  rows.forEach(r => {
    const id = String(r.id||""); if(!id) return;
    seen[id] = true;
    const at = Date.parse(r.updated||"") || 0;
    const cur = byId[id];
    if(!cur){
      const l = mkLead({id:id, updated:at || Date.now()});
      db.leads.push(applyRow(l, r));
    }else if(at > (cur.updated||0)){
      applyRow(cur, r); cur.updated = at;
    }
  });
  // Rows you delete in the spreadsheet disappear here too.
  const prev = cfg.ids || [];
  if(prev.length){
    const gone = prev.filter(id => !seen[id]);
    if(gone.length) db.leads = db.leads.filter(l => gone.indexOf(l.id) === -1);
  }
  cfg.ids = rows.map(r => String(r.id));
}

async function sheetCall(payload){
  const cfg = db.settings.sheet;
  const ctl = new AbortController();
  const bail = setTimeout(()=>ctl.abort(), 25000);
  try{
    const res = await fetch(cfg.url, {
      method:"POST",
      // text/plain keeps this a "simple" request, so the browser skips the
      // CORS preflight that Apps Script web apps can't answer.
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({token:cfg.token}, payload)),
      redirect:"follow"
    });
    if(!res.ok) throw new Error("the sheet replied "+res.status);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error==="bad_token" ? "wrong token" : (data.error||"the script refused"));
    return data;
  }catch(err){
    if(err.name==="AbortError") throw new Error("timed out");
    if(err instanceof TypeError) throw new Error("couldn't reach the sheet");
    throw err;
  }finally{ clearTimeout(bail); }
}

function pendingCount(){
  const since = db.settings.sheet.at || 0;
  let n = db.leads.filter(l => (l.updated||0) > since).length + (db.deleted||[]).length;
  db.leads.forEach(l => l.calls.forEach(c => { if(!c.synced) n++; }));
  return n;
}
function paintSync(){
  const btn = $("#btnSync"), cfg = db.settings.sheet;
  if(!cfg.url){ btn.removeAttribute("data-s"); btn.title = "Connect a Google Sheet"; return; }
  const n = pendingCount();
  const s = state.sync.busy ? "busy" : state.sync.error ? "error" : n ? "pending" : "ok";
  btn.dataset.s = s;
  btn.title = s==="busy" ? "Syncing…"
    : s==="error" ? "Sync failed: "+state.sync.error
    : s==="pending" ? n+" change"+(n===1?"":"s")+" waiting — tap to sync"
    : "Synced "+(cfg.at?when(cfg.at):"");
}
async function syncNow(manual){
  const cfg = db.settings.sheet;
  if(!cfg.url){ if(manual) toast("Add your sheet's web app URL in Settings first"); return false; }
  if(state.sync.busy) return false;
  state.sync.busy = true; state.sync.error = ""; paintSync();
  const startedAt = Date.now();
  try{
    const push = db.leads.filter(l => (l.updated||0) > (cfg.at||0)).map(leadRow);
    const log = [];
    db.leads.forEach(l => l.calls.forEach(c => { if(!c.synced) log.push(logRow(l, c)); }));
    const data = await sheetCall({leads:push, log:log, remove:db.deleted||[]});
    mergeRemote(data.leads||[]);
    db.leads.forEach(l => l.calls.forEach(c => { c.synced = true; }));
    db.deleted = [];
    cfg.at = startedAt;
    save(); render();
    if(manual) toast("Synced — "+(data.leads||[]).length+" leads in the sheet");
    return true;
  }catch(err){
    state.sync.error = String(err.message||err);
    if(manual) toast("Sync failed — "+state.sync.error);
    return false;
  }finally{
    state.sync.busy = false; paintSync();
  }
}
let autoT;
function autoSync(){
  const cfg = db.settings.sheet;
  paintSync();
  if(!cfg.url || !cfg.auto) return;
  clearTimeout(autoT);
  autoT = setTimeout(()=>syncNow(false), 4000);
}
document.addEventListener("visibilitychange", () => {
  const cfg = db.settings.sheet;
  if(document.visibilityState!=="visible" || !cfg.url || !cfg.auto) return;
  if(Date.now() - (cfg.at||0) > 120000) syncNow(false);
});

function parseCSV(text){
  text = text.replace(/^﻿/,"").replace(/\r\n?/g,"\n");
  const delim = (text.split("\n")[0].split("\t").length > text.split("\n")[0].split(",").length) ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += c;
    }else{
      if(c === '"') q = true;
      else if(c === delim){ row.push(cell); cell=""; }
      else if(c === "\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell += c;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== "")).map(r => r.map(x => x.trim()));
}
const FIELDS = [
  ["business","Business name"], ["owner","Owner / contact"], ["owner_first","Owner first name"],
  ["owner_last","Owner last name"], ["phone","Phone"], ["email","Email"],
  ["metro","Metro area"], ["location","City / location"], ["website","Website"], ["value","Quote / deal size"], ["note","Note"], ["","— skip —"]
];
const GUESS = [
  [/^(business|company|account|dba|org|organi[sz]ation)( ?name)?$|^name$/i, "business"],
  [/first ?name|fname|owner ?first/i, "owner_first"],
  [/last ?name|lname|surname|owner ?last/i, "owner_last"],
  [/owner|contact|principal|poc|decision/i, "owner"],
  [/phone|mobile|cell|tel|number/i, "phone"],
  [/e-?mail/i, "email"],
  [/metro|market|msa|region|dma/i, "metro"],
  [/city|town|address|street|location|state|zip/i, "location"],
  [/web|site|url|domain/i, "website"],
  [/value|quote|deal|amount|budget|revenue|price|ticket/i, "value"],
  [/note|comment|remark|detail/i, "note"]
];
function guessField(header, used){
  for(const [re, f] of GUESS){ if(re.test(header) && !used.has(f)) return f; }
  return "";
}

function rowToLead(r, m){
  const g = k => m[k]!==undefined ? (r[m[k]]||"").trim() : "";

          metro:g("metro"), location:g("location"), website:g("website"), value:parseMoney(g("value")),
          note:g("note"), status:"new"};
}

    const last = l.calls[l.calls.length-1];
    return [l.business,l.owner,l.phone,l.email,l.metro,l.location,l.website,l.value||"",(STATUS[l.status]||{}).label||l.status,
      l.followAt, l.calls.length, last?new Date(last.at).toISOString():"", last?last.note:""];
  });
  return [head, ...rows].map(r => r.map(csvCell).join(",")).join("\n");
}
function logCSV(){
  const head = ["when","business","owner","phone","metro","outcome","deal_value","note"];
  const rows = [];
  db.leads.forEach(l => l.calls.forEach(c => rows.push([new Date(c.at).toISOString(), l.business, l.owner, l.phone, l.metro,
    (STATUS[c.outcome]||{}).label||"Dialed", l.value||"", c.note])));
  rows.sort((a,b)=> a[0]<b[0]?1:-1);
  return [head, ...rows].map(r => r.map(csvCell).join(",")).join("\n");
}
function exportModal(kind){
  const text = kind==="log" ? logCSV() : kind==="json" ? JSON.stringify(db,null,2) : leadsCSV();
  const title = kind==="log" ? "Call log" : kind==="json" ? "Backup" : "Leads";
  openModal("Export — "+title, `
    <div class="toolbar" style="padding:0 0 12px">
      <button class="tool ${kind!=="log"&&kind!=="json"?"go":""}" data-x="leads">Leads CSV</button>
      <button class="tool ${kind==="log"?"go":""}" data-x="log">Call log CSV</button>
      <button class="tool ${kind==="json"?"go":""}" data-x="json">Full backup</button>
    </div>
    <p class="help">Copy this straight into a spreadsheet, or save it as a file. Keep a backup — everything lives in this browser only.</p>
    <textarea class="paste" id="xText" style="min-height:200px" readonly>${esc(text)}</textarea>
  `, `<button class="btn" id="xDown">Save file</button><button class="btn primary" id="xCopy">Copy</button>`, () => {
    $("#mBody").addEventListener("click", e => { const b = e.target.closest("[data-x]"); if(b) exportModal(b.dataset.x); });
    $("#xCopy").addEventListener("click", async () => {
      const ta = $("#xText"); ta.select();
      try{ await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
      catch(e){ document.execCommand("copy"); toast("Copied"); }
    });
    $("#xDown").addEventListener("click", async () => {
      const name = kind==="json" ? "dial-sheet-backup.json" : kind==="log" ? "call-log.csv" : "leads.csv";
      // Hosted viewers hand the file over through their own save prompt.
      if(window.claude && typeof window.claude.use === "function"){
        const dl = await window.claude.use("downloads").catch(()=>null);
        if(!dl){ toast("Saving isn't available here — use Copy"); return; }
        try{ await dl.save({filename:name, data:text}); toast("Saved"); }
        catch(err){
          if(err && err.code === "extension_not_enabled"){
            try{ await dl.save({filename:name.replace(/\.csv$/,".txt"), data:text}); toast("Saved as .txt"); return; }
            catch(e2){ err = e2; }
          }
          if(!err || err.code !== "declined") toast("Couldn't save — use Copy instead");
        }
        return;
      }
      const blob = new Blob([text], {type: kind==="json"?"application/json":"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Saving… if nothing downloads, use Copy instead");
    });
  });
}
function restore(text){
  try{
    const d = JSON.parse(text);
    if(!d.leads) throw 0;
    db = {v:1, leads:d.leads.map(mkLead), scripts:d.scripts&&d.scripts.length?d.scripts:blank().scripts,
          settings:Object.assign(blank().settings, d.settings||{})};
    save(); applyTheme(); render(); closeModal(); toast("Backup restored");
  }catch(e){ toast("That file didn't look like a backup"); }
}
function settingsModal(){
  const s = db.settings;
  openModal("Settings", `
    <div class="fields">
      <div class="f"><label for="p_me">Your name</label><input id="p_me" value="${esc(s.me)}" placeholder="Used in scripts as {{me}}" /></div>
      <div class="f"><label for="p_company">Your company</label><input id="p_company" value="${esc(s.company)}" placeholder="Used as {{company}}" /></div>
      <div class="f"><label for="p_offer">Your one-liner</label><textarea id="p_offer" rows="3" placeholder="Used as {{offer}}">${esc(s.offer)}</textarea></div>
      <div class="f"><label for="p_theme">Appearance</label><select id="p_theme">
        <option value="auto" ${s.theme==="auto"?"selected":""}>Match my device</option>
        <option value="light" ${s.theme==="light"?"selected":""}>Light</option>
        <option value="dark" ${s.theme==="dark"?"selected":""}>Dark</option></select></div>
    </div>
    <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px">Google Sheet</h3>
    <p class="help">Keep your list in a spreadsheet and use this as the dialer. Add rows there, call them here, and every outcome, note and follow-up date writes back. Setup steps are in <code>sheet-sync.gs</code>.</p>
    <div class="fields">
      <div class="f"><label for="p_url">Web app URL</label><input id="p_url" value="${esc(s.sheet.url)}" placeholder="https://script.google.com/macros/s/…/exec" /></div>
      <div class="f"><label for="p_token">Token</label><input id="p_token" value="${esc(s.sheet.token)}" placeholder="the TOKEN you set in the script" /></div>
      <label style="display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-2);padding:2px 0">
        <input type="checkbox" id="p_auto" ${s.sheet.auto?"checked":""} style="width:18px;height:18px" />
        Sync automatically after each call
      </label>
    </div>
    <div class="toolbar" style="padding:10px 0 0"><button class="tool go" id="pSync">Connect &amp; sync now</button></div>
    <p class="help" id="syncState" style="margin-top:8px"></p>
    <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px">Your data</h3>
    <p class="help">Without a sheet connected, leads, notes and scripts live in this browser only — nothing is uploaded anywhere. Export a backup before clearing your browser data or switching phones.</p>
    <div class="toolbar" style="padding:0">
      <button class="tool" id="pRestore">Restore backup</button>
      <button class="tool" id="pSamples">Remove sample leads</button>
      <button class="tool" id="pWipe" style="color:var(--brick)">Erase everything</button>
    </div>
  `, `<button class="btn primary" id="pSave" style="flex:1">Done</button>`, () => {
    const saveSettings = () => {
      s.me = $("#p_me").value.trim(); s.company = $("#p_company").value.trim();
      s.offer = $("#p_offer").value.trim(); s.theme = $("#p_theme").value;
      s.sheet.url = $("#p_url").value.trim(); s.sheet.token = $("#p_token").value.trim();
      s.sheet.auto = $("#p_auto").checked;
      save(); applyTheme();
    };
    const paintState = () => {
      const el = $("#syncState"); if(!el) return;
      el.innerHTML = !s.sheet.url ? "Not connected."
        : state.sync.busy ? "Syncing…"
        : state.sync.error ? `<span style="color:var(--brick)">Last try failed — ${esc(state.sync.error)}</span>`
        : s.sheet.at ? `Last synced ${esc(when(s.sheet.at))} · ${(n=>n?n+" change"+(n===1?"":"s")+" waiting":"everything up to date")(pendingCount())}`
        : "Connected but not synced yet.";
    };
    paintState();
    $("#pSave").addEventListener("click", () => { saveSettings(); closeModal(); toast("Saved"); });
    $("#pSync").addEventListener("click", async () => {
      saveSettings();
      if(!s.sheet.url){ toast("Paste the web app URL first"); return; }
      paintState();
      const ok = await syncNow(true);
      paintState();
      if(ok) render();
    });
    $("#p_theme").addEventListener("change", e => { s.theme = e.target.value; applyTheme(); });
    $("#pRestore").addEventListener("click", ()=>{ $("#filePick").dataset.mode="json"; $("#filePick").click(); });
    $("#pSamples").addEventListener("click", ()=>{
      const n = db.leads.filter(l=>l.sample).length;
      if(!n){ toast("No sample leads left"); return; }
      db.leads = db.leads.filter(l=>!l.sample); save(); render(); toast("Removed "+n+" sample leads");
    });
    $("#pWipe").addEventListener("click", ()=>{
      if(!confirm("Erase all leads, notes and scripts on this device? Export a backup first.")) return;
      db = blank(); db.leads = []; save(); applyTheme(); render(); closeModal(); toast("Erased");
    });
  });
}
function applyTheme(){
  const t = db.settings.theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* ============================== boot ============================== */
$("#btnImport").addEventListener("click", importModal);
$("#btnAdd").addEventListener("click", addModal);
$("#btnScripts").addEventListener("click", scriptsModal);
$("#btnExport").addEventListener("click", ()=>exportModal("leads"));
$("#btnSettings").addEventListener("click", settingsModal);
$("#btnSync").addEventListener("click", ()=>syncNow(true));
window.addEventListener("beforeunload", save);

applyTheme();
render();
if(db.settings.sheet.url && db.settings.sheet.auto) setTimeout(()=>syncNow(false), 800);
})();
</script>
</body>
</html>
