<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#12A150" />
<title>Dial Sheet</title>
<style>
:root{
  --ground:#EAEDE8; --surface:#FFFFFF; --surface-2:#F2F5F1; --sunk:#E1E6DF;
  --line:#D5DCD4; --line-soft:#E4E9E3;
  --ink:#141915; --ink-2:#46514A; --muted:#76847B;
  --dial:#12A150; --dial-press:#0C8341; --on-dial:#FFFFFF;
  --pine:#0E7A4A; --clay:#C2683A; --brick:#A33A3A; --slate:#5E7268; --dusk:#5A6B86;
  --shadow:0 1px 2px rgba(20,25,21,.06), 0 8px 24px rgba(20,25,21,.07);
  --sheet-shadow:0 -8px 40px rgba(20,25,21,.22);
  --r:14px; --r-sm:9px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F120F; --surface:#171B18; --surface-2:#1D221E; --sunk:#0A0D0A;
    --line:#2A312C; --line-soft:#232A25;
    --ink:#E7ECE6; --ink-2:#AFBCB2; --muted:#7E8D83;
    --dial:#25C06A; --dial-press:#1DA85B; --on-dial:#06210F;
    --pine:#46C68C; --clay:#DE9061; --brick:#D97676; --slate:#8FA396; --dusk:#93A8C6;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --sheet-shadow:0 -8px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0F120F; --surface:#171B18; --surface-2:#1D221E; --sunk:#0A0D0A;
  --line:#2A312C; --line-soft:#232A25;
  --ink:#E7ECE6; --ink-2:#AFBCB2; --muted:#7E8D83;
  --dial:#25C06A; --dial-press:#1DA85B; --on-dial:#06210F;
  --pine:#46C68C; --clay:#DE9061; --brick:#D97676; --slate:#8FA396; --dusk:#93A8C6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --sheet-shadow:0 -8px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent; overflow-wrap:break-word;
}
button,input,select,textarea{font:inherit;color:inherit}
input[type="checkbox"]{accent-color:var(--dial)}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--dial); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hide{display:none !important}
[hidden]{display:none !important}

/* ---------- app shell ---------- */
.app{max-width:720px;margin:0 auto;padding:0 0 96px}
.topbar{
  position:sticky; top:0; z-index:30; background:var(--ground);
  padding:max(10px,env(safe-area-inset-top)) 14px 8px; border-bottom:1px solid var(--line-soft);
}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--dial);display:grid;place-items:center;flex:none}
.mark svg{width:15px;height:15px;fill:var(--on-dial)}
.brand{font-size:17px;font-weight:680;letter-spacing:-.01em;margin:0}
.brandrow .spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line-soft)}
.iconbtn.sync{position:relative}
.iconbtn.sync .dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--muted);border:1.5px solid var(--ground);display:none}
.iconbtn.sync[data-s] .dot{display:block}
.iconbtn.sync[data-s="ok"] .dot{background:var(--pine)}
.iconbtn.sync[data-s="pending"] .dot{background:var(--clay)}
.iconbtn.sync[data-s="error"] .dot{background:var(--brick)}
.iconbtn.sync[data-s="busy"] svg{animation:spin 1s linear infinite}
.iconbtn.sync[data-s="busy"] .dot{background:var(--dial)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.iconbtn.sync[data-s="busy"] svg{animation:none}}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:7px 10px}
.stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.due b{color:var(--clay)}
.stat.pipe b{color:var(--pine)}

.searchwrap{position:relative;margin-bottom:9px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;pointer-events:none}
#q{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
#q::placeholder{color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:560;color:var(--ink-2);white-space:nowrap;
}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--ground);opacity:.65}

.toolbar{display:flex;gap:7px;padding:10px 14px 4px;flex-wrap:wrap}
.tool{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:580;color:var(--ink-2);
}
.tool:hover{border-color:var(--muted)}
.tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.go{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- lead list ---------- */
.list{padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.lead{
  display:flex;align-items:stretch;gap:10px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;position:relative;
}
.lead::before{content:"";width:3px;flex:none;background:var(--st,transparent)}
.lead.due::after{content:"";position:absolute;top:9px;right:78px;width:6px;height:6px;border-radius:50%;background:var(--clay)}
.leadbody{flex:1;min-width:0;padding:11px 4px 11px 8px;text-align:left;display:block}
.lname{font-size:16px;font-weight:640;letter-spacing:-.01em;line-height:1.25;margin:0 0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmeta{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.lmeta .sep{color:var(--line);margin:0 5px}
.lsub{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.lsub .last{overflow:hidden;text-overflow:ellipsis}
.lsub .val{color:var(--pine);font-weight:640}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:640;letter-spacing:.03em;
  text-transform:uppercase;color:var(--st,var(--muted))}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.dialbtn{
  flex:none;width:74px;background:var(--surface-2);border-left:1px solid var(--line-soft);
  display:grid;place-items:center;text-decoration:none;color:inherit;
}
.dialbtn .circle{
  width:48px;height:48px;border-radius:50%;background:var(--dial);display:grid;place-items:center;
  box-shadow:0 2px 8px color-mix(in srgb, var(--dial) 40%, transparent);transition:transform .12s ease,background .12s ease;
}
.dialbtn:active .circle{transform:scale(.92);background:var(--dial-press)}
.dialbtn svg{width:21px;height:21px;fill:var(--on-dial)}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--read);font-size:21px;font-weight:400;color:var(--ink);margin:0 0 8px}
.empty p{font-size:14px;margin:0 auto;max-width:34ch;line-height:1.6}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);
  max-width:720px;margin:0 auto;max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheethead{padding:10px 16px 8px;border-bottom:1px solid var(--line-soft);flex:none}
.sheethead h2{margin:0;font-size:19px;font-weight:660;letter-spacing:-.015em;line-height:1.25}
.sheethead .who{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.callrow{display:flex;align-items:center;gap:10px;margin-top:9px}
.callrow a.num{font-family:var(--mono);font-size:15px;color:var(--pine);text-decoration:none;font-weight:600}
.timer{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.timer .live{width:7px;height:7px;border-radius:50%;background:var(--dial);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.timer .live{animation:none}}
.tabs{display:flex;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--line-soft);flex:none}
.tab{padding:8px 12px 9px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--dial)}
.panes{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane{padding:14px 16px 8px}
.script{font-family:var(--read);font-size:var(--sfs,18px);line-height:1.62;color:var(--ink);white-space:pre-wrap}
.script mark{background:color-mix(in srgb,var(--dial) 20%,transparent);color:inherit;border-radius:3px;padding:0 2px;font-weight:600;font-family:var(--ui);font-size:.94em}
.scriptbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.scriptbar select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;max-width:55%}
.szbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px;display:grid;place-items:center;color:var(--ink-2)}
#notes{width:100%;min-height:190px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical;font-size:16px;line-height:1.5}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{padding:5px 10px;border:1px dashed var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.quick button:hover{border-style:solid;color:var(--ink)}
.fields{display:grid;gap:10px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:660;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{display:flex;flex-direction:column;gap:0}
.logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.logitem:last-child{border-bottom:0}
.logitem .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:82px;flex:none;padding-top:2px}
.logitem .what{flex:1;min-width:0;font-size:14px}
.logitem .what b{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--st,var(--ink-2))}
.logitem .what p{margin:3px 0 0;color:var(--ink-2);white-space:pre-wrap;font-size:13.5px}

.outcomes{padding:12px 16px;border-top:1px solid var(--line-soft);background:var(--surface);flex:none}
.olabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:660;margin-bottom:7px}
.outcomes{padding:10px 16px 11px}
.ogrid{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.ogrid::-webkit-scrollbar{display:none}
.o{flex:none;padding:9px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:620;color:var(--ink-2);white-space:nowrap;line-height:1.2}
.o[aria-pressed="true"]{background:var(--oc);border-color:var(--oc);color:#fff}
.sheetfoot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);flex:none}
.btn{flex:1;padding:13px 10px;border-radius:12px;font-size:14.5px;font-weight:660;text-align:center;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.dial{background:var(--dial);color:var(--on-dial);border-color:var(--dial);text-decoration:none;display:grid;place-items:center}

/* ---------- modal (import / add / scripts / settings) ---------- */
.modal{
  position:fixed;inset:auto 0 0;z-index:50;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:var(--sheet-shadow);max-width:720px;margin:0 auto;max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.modal.on{transform:translateY(0)}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex:none}
.mhead h2{margin:0;font-size:17px;font-weight:660;flex:1;letter-spacing:-.01em}
.mbody{padding:14px 16px;overflow-y:auto;flex:1}
.mfoot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);flex:none}
.help{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 12px}
.help code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:12px}
.drop.over{border-color:var(--dial);color:var(--pine);background:color-mix(in srgb,var(--dial) 7%,transparent)}
.drop b{color:var(--ink);font-size:14px;display:block;margin-bottom:3px}
textarea.paste{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;resize:vertical;line-height:1.5}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.maprow .src{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px}
.preview{font-size:12.5px;color:var(--muted);margin-top:10px;font-family:var(--mono);line-height:1.6}
.slist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.srow{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface-2)}
.srow .nm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .mini{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:7px}
.tokens{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
.tokens button{font-family:var(--mono);font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);background:var(--surface-2)}
.danger{color:var(--brick)}

.gate{position:fixed;inset:0;z-index:90;background:var(--ground);display:grid;place-items:center;padding:24px;overflow-y:auto}
.gatebox{width:100%;max-width:360px}
.gatemark{width:44px;height:44px;border-radius:13px;background:var(--dial);display:grid;place-items:center;margin-bottom:20px}
.gatemark svg{width:24px;height:24px;fill:var(--on-dial)}
.gate h1{font-size:27px;font-weight:680;letter-spacing:-.02em;margin:0 0 5px}
.gate p{margin:0 0 22px;color:var(--muted);font-size:14.5px}
.gate .f{margin-bottom:13px}
.gate .f input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px}
.gate .btn{width:100%;margin-top:6px}
.gateerr{min-height:0;margin:0;color:var(--brick);font-size:13.5px;line-height:1.45}
.gateerr:not(:empty){margin:2px 0 10px}
.gatefoot{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.gatefoot button{font-size:13.5px;color:var(--ink-2);font-weight:560;text-decoration:underline;text-underline-offset:3px}
.gatefoot button:hover{color:var(--ink)}
.booting{position:fixed;inset:0;z-index:95;background:var(--ground);display:grid;place-items:center;color:var(--muted);font-size:14px;padding:24px;text-align:center}
.bootfail{max-width:400px;text-align:left}
.bootfail h2{font-size:19px;font-weight:660;color:var(--ink);margin:0 0 8px;letter-spacing:-.01em}
.bootfail p{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.bootfail code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink)}
.bootfail .why{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px;margin-top:12px;word-break:break-word}
.modal.wide{max-width:1180px;height:94dvh}
.tbar{display:flex;gap:8px;align-items:center;padding:0 0 10px;flex-wrap:wrap}
.tbar input[type="search"]{flex:1;min-width:150px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:15px}
.tscroll{overflow:auto;border:1px solid var(--line-soft);border-radius:11px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.grid th,table.grid td{padding:0;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.grid thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660;
  padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;
}
table.grid thead th.plain{cursor:default}
table.grid thead th .ar{color:var(--dial);margin-left:3px}
table.grid td{color:var(--ink)}
table.grid td .cell{padding:9px 10px;min-height:36px;display:block;overflow:hidden;text-overflow:ellipsis;max-width:230px;cursor:text}
table.grid td .cell:hover{background:var(--surface-2)}
table.grid td.num .cell{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.grid td.mono .cell{font-family:var(--mono)}
table.grid tbody tr:hover{background:color-mix(in srgb,var(--dial) 4%,transparent)}
table.grid tbody tr.on{background:color-mix(in srgb,var(--dial) 9%,transparent)}
table.grid .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:660;
  color:#fff;background:var(--sc,var(--slate));white-space:nowrap}
table.grid .chk{width:38px;text-align:center}
table.grid .chk input{width:16px;height:16px;vertical-align:middle}
table.grid td.act{width:44px;text-align:center}

<script>
(function(){
  // If anything below fails to load, say what happened instead of leaving
  // the reader staring at "Loading…" forever.
  function fail(title, detail, why){
    var el = document.getElementById("booting");
    if(!el) return;
    el.hidden = false;
    el.innerHTML = '<div class="bootfail"><h2>' + title + '</h2><p>' + detail + '</p>' +
      (why ? '<div class="why">' + why + '</div>' : '') + '</div>';
  }
  window.__bootFail = fail;
  window.addEventListener("error", function(e){
    if(e && e.target && e.target.src){
      fail("Part of the app didn't load",
        "The browser couldn't fetch <code>" + String(e.target.src).split("/").slice(-2).join("/") + "</code>. If you just deployed, that file probably didn't ship with the site.",
        "Open it directly in this browser to confirm — a 404 page means it is missing.");
      return;
    }
    fail("The app didn't start", "Something failed while loading.", (e && e.message) || "");
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    fail("The app didn't start", "Something failed while loading.",
      String((e && e.reason && e.reason.message) || (e && e.reason) || ""));
  });
})();
</script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";

/* ============================== storage ============================== */
if(!window.supabase || !window.supabase.createClient){
  window.__bootFail("Part of the app didn't load",
    "<code>vendor/supabase.js</code> is missing or didn't finish loading.",
    "Check that the <code>vendor</code> folder shipped with your deployment.");
  return;
}
if(!window.DIALER_CONFIG || !window.DIALER_CONFIG.url || !window.DIALER_CONFIG.anonKey){
  window.__bootFail("Missing settings",
    "<code>config.js</code> didn't load, or has no project URL and key in it.",
    "It sits next to index.html and holds your Supabase URL and anon key.");
  return;
}
const sb = window.supabase.createClient(window.DIALER_CONFIG.url, window.DIALER_CONFIG.anonKey, {
  auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
});
let me = null;                                   // the signed-in user
const cacheKey = () => "dialsheet.v2." + (me ? me.id : "anon");
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16);
    }));
const isUuid = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v||""));

const DEFAULT_SCRIPT = `Hi, is this {{owner}}?

Hey {{owner}}, this is {{me}} with {{company}} — I'll be quick. I'm calling local {{metro}} businesses, and {{business}} came up on my list.

The reason for the call: {{offer}}

[PAUSE — let them react]

Is that something you handle, or is there someone else there who does?

— IF INTERESTED —
Great. Two quick questions so I don't waste your time:
1. How are you getting new customers right now?
2. What would another 5–10 jobs a month actually be worth to you?

Sounds like it's worth 15 minutes. I've got Tuesday morning or Thursday afternoon — which is easier?

— IF "SEND ME SOMETHING" —
Happy to. What's the best email? … And so I send the right thing, what's the one part you'd want to see first?

— IF "NOT INTERESTED" —
Totally fair. Before I let you go — is it that you're covered right now, or just bad timing?

— IF GATEKEEPER —
No problem — when's {{owner}} usually around? I'll call back then rather than bug you.

CLOSE: Appreciate the time, {{owner}}. Talk soon.`;

const STATUS = {
  new:        {label:"New",            color:"var(--slate)"},
  callback:   {label:"Callback",       color:"var(--clay)"},
  interested: {label:"Interested",     color:"var(--pine)"},
  meeting:    {label:"Meeting set",    color:"var(--pine)"},
  voicemail:  {label:"Voicemail",      color:"var(--dusk)"},
  noanswer:   {label:"No answer",      color:"var(--slate)"},
  no:         {label:"Not interested", color:"var(--brick)"},
  bad:        {label:"Bad number",     color:"var(--brick)"},
  dnc:        {label:"Do not call",    color:"var(--brick)"}
};
const OUTCOMES = ["interested","meeting","callback","voicemail","noanswer","no","bad","dnc"];
const CLOSED = ["no","bad","dnc","meeting"];

let db = blank();

function blank(){
  return {
    v:1,
    leads: [],
    scripts: [{id:uid(), name:"Cold call — local business", body:DEFAULT_SCRIPT}],
    deleted: [],
    scriptsUpdated: 0,
    settings: {me:"", company:"", offer:"we help local businesses get more inbound calls without spending more on ads",
      theme:"auto", scriptId:null, scriptSize:18, updated:0,
      sync:{at:0, ids:[]}}
  };
}
function load(){
  try{
    const raw = localStorage.getItem(cacheKey());
    if(!raw) return blank();
    const d = JSON.parse(raw);
    d.leads = (d.leads||[]).map(mkLead);
    if(!d.scripts || !d.scripts.length) d.scripts = blank().scripts;
    d.settings = Object.assign(blank().settings, d.settings||{});
    d.settings.sync = Object.assign(blank().settings.sync, d.settings.sync||{});
    d.deleted = d.deleted || [];
    return d;
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(cacheKey(), JSON.stringify(db)); }
  catch(e){ toast("Couldn't save — storage is full or blocked"); }
}
function mkLead(o){
  const l = Object.assign({
    id:uid(), business:"", owner:"", metro:"", location:"", phone:"", email:"", website:"",
    value:0, status:"new", followAt:"", calls:[], created:Date.now(), updated:0, sample:false
  }, o);
  if(o && o.note && !(l.calls||[]).length){
    l.calls = [{id:uid(), at:Date.now()-86400000, outcome:l.status, note:o.note}];
  }
  delete l.note;
  l.calls = l.calls || [];
  l.value = +l.value || 0;
  l.updated = +l.updated || Date.now();
  if(!isUuid(l.id)) l.id = uid();
  l.calls.forEach(c => { if(!c.id) c.id = uid(); });
  return l;
}

/* ============================== helpers ============================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function digits(s){ return String(s||"").replace(/[^\d+]/g,""); }
function normPhone(s){
  let d = String(s||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.length===11 && d[0]==="1") return "+"+d;
  if(d.length===10) return "+1"+d;
  if(String(s).trim().startsWith("+")) return "+"+d;
  return d.length>11 ? "+"+d : d;
}
function fmtPhone(p){
  const d = String(p||"").replace(/\D/g,"");
  if(d.length===11 && d[0]==="1") return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p||"";
}
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function isToday(ts){ if(!ts) return false; const d=new Date(ts); const n=new Date(); return d.toDateString()===n.toDateString(); }
function when(ts){
  const d = new Date(ts), n = new Date();
  const day = d.toDateString()===n.toDateString() ? "Today"
    : d.toDateString()===new Date(n-864e5).toDateString() ? "Yest"
    : d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return day+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function touch(l){ l.updated = Date.now(); return l; }
function lastCallAt(l){ return l.calls.length ? l.calls[l.calls.length-1].at : 0; }
function firstName(s){ return String(s||"").trim().split(/\s+/)[0] || ""; }
function parseMoney(s){ const n = parseFloat(String(s==null?"":s).replace(/[^0-9.]/g,"")); return isFinite(n) && n>0 ? n : 0; }
function money(n){
  n = +n || 0;
  if(n >= 1e6) return "$"+(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n >= 1e4) return "$"+(n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"k";
  return "$"+Math.round(n).toLocaleString();
}
const OPEN_VALUE = ["interested","meeting","callback"];

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2600);
}

/* ============================== list ============================== */
const FILTERS = [
  {id:"tocall",     label:"To call",     fn:l => !CLOSED.includes(l.status)},
  {id:"due",        label:"Follow-ups",  fn:l => l.followAt && l.followAt <= today()},
  {id:"interested", label:"Interested",  fn:l => l.status==="interested"},
  {id:"meeting",    label:"Meetings",    fn:l => l.status==="meeting"},
  {id:"uncalled",   label:"Never called",fn:l => !l.calls.length},
  {id:"all",        label:"All",         fn:() => true},
  {id:"closed",     label:"Closed",      fn:l => ["no","bad","dnc"].includes(l.status)}
];
let state = {filter:"tocall", q:"", leadId:null, callIdx:-1, tab:"script", timerT:null, sync:{busy:false, error:""}};

function visible(){
  const f = FILTERS.find(x=>x.id===state.filter) || FILTERS[0];
  const q = state.q.trim().toLowerCase();
  let out = db.leads.filter(f.fn);
  if(q){
    const qd = q.replace(/\D/g,"");
    out = out.filter(l =>
      (l.business+" "+l.owner+" "+l.metro+" "+l.location+" "+l.email).toLowerCase().includes(q) ||
      (qd && l.phone.replace(/\D/g,"").includes(qd))
    );
  }
  return out.sort(sortQueue);
}
function sortQueue(a,b){
  const rank = l => {
    if(l.followAt && l.followAt <= today()) return 0;
    if(!l.calls.length) return 1;
    if(CLOSED.includes(l.status)) return 4;
    if(l.status==="interested") return 2;
    return 3;
  };
  const r = rank(a)-rank(b);
  if(r) return r;
  if(a.followAt && b.followAt) return a.followAt < b.followAt ? -1 : 1;
  return lastCallAt(a)-lastCallAt(b);
}
function queue(){
  return db.leads.filter(l => !CLOSED.includes(l.status)).sort(sortQueue);
}

function renderFilters(){
  $("#filters").innerHTML = FILTERS.map(f => {
    const n = db.leads.filter(f.fn).length;
    return `<button class="chip" data-f="${f.id}" aria-pressed="${state.filter===f.id}">${esc(f.label)}<span class="n">${n}</span></button>`;
  }).join("");
}
function renderStats(){
  let calls=0, conn=0;
  db.leads.forEach(l => l.calls.forEach(c => {
    if(isToday(c.at)){ calls++; if(["interested","meeting","callback","no"].includes(c.outcome)) conn++; }
  }));
  $("#sCalls").textContent = calls;
  $("#sConn").textContent  = conn;
  $("#sDue").textContent   = db.leads.filter(l=>l.followAt && l.followAt<=today()).length;
  $("#sPipe").textContent  = money(db.leads.filter(l=>OPEN_VALUE.includes(l.status)).reduce((t,l)=>t+(+l.value||0),0));
}
function renderList(){
  const rows = visible();
  const el = $("#list");
  if(!rows.length){
    el.innerHTML = `<div class="empty"><h2>Nothing here yet</h2>
      <p>Import a CSV of businesses, or add one by hand. Tap the green circle to dial — the call sheet opens on its own.</p></div>`;
    return;
  }
  el.innerHTML = rows.map(l => {
    const st = STATUS[l.status] || STATUS.new;
    const due = l.followAt && l.followAt <= today();
    const meta = [l.owner, l.metro || l.location].filter(Boolean).map(esc).join('<span class="sep">/</span>');
    const last = due ? "due "+l.followAt : (l.calls.length ? when(lastCallAt(l)) : "");
    return `<article class="lead ${due?"due":""}" style="--st:${st.color}">
      <button class="leadbody" data-open="${l.id}">

/* ============================== supabase sync ==============================
   The device keeps a local copy so the app works with no signal. Every
   change is stamped and queued; syncing pushes what changed, then pulls
   the server's view back. Row-level security means these queries can only
   ever touch this account's rows.                                        */

const STATUS_BY_LABEL = {};
Object.keys(STATUS).forEach(k => STATUS_BY_LABEL[STATUS[k].label.toLowerCase()] = k);
function statusKey(v){
  const t = String(v||"").trim().toLowerCase();
  return STATUS[t] ? t : (STATUS_BY_LABEL[t] || "new");
}

function leadRow(l){
  return {id:l.id, user_id:me.id, business:l.business||"", owner:l.owner||"", phone:l.phone||"",
          email:l.email||"", metro:l.metro||"", location:l.location||"", website:l.website||"",
          deal_value:+l.value||0, status:l.status||"new", follow_at:l.followAt || null};
}
function callRow(l, c){
  return {id:c.id, user_id:me.id, lead_id:l.id, called_at:new Date(c.at).toISOString(),
          outcome:c.outcome || null, note:c.note||""};
}
function applyRow(l, r){
  l.business = r.business||""; l.owner = r.owner||"";
  l.phone = r.phone||""; l.email = r.email||"";
  l.metro = r.metro||""; l.location = r.location||""; l.website = r.website||"";
  l.value = +r.deal_value||0; l.status = statusKey(r.status);
  l.followAt = r.follow_at ? String(r.follow_at).slice(0,10) : "";
  l.updated = Date.parse(r.updated_at||"") || Date.now();
  return l;
}

function mergeLeads(rows, startedAt){
  const cfg = db.settings.sync;
  const byId = {}; db.leads.forEach(l => byId[l.id] = l);
  const seen = {};
  rows.forEach(r => {
    seen[r.id] = true;
    const cur = byId[r.id];
    if(!cur){
      const fresh = applyRow(mkLead({id:r.id}), r);
      fresh.updated = startedAt;                 // arrived from the server: clean
      db.leads.push(fresh);
      return;
    }
    // Anything edited while the request was in flight keeps its local value,
    // and stays queued. Everything else is now level with the server.
    if((cur.updated||0) <= startedAt){ applyRow(cur, r); cur.updated = startedAt; }
  });
  const prev = cfg.ids || [];
  if(prev.length){
    const gone = prev.filter(id => !seen[id]);
    if(gone.length) db.leads = db.leads.filter(l => gone.indexOf(l.id) === -1);
  }
  cfg.ids = rows.map(r => r.id);
}
function mergeCalls(rows){
  const byLead = {};
  rows.forEach(r => { (byLead[r.lead_id] = byLead[r.lead_id] || []).push(r); });
  db.leads.forEach(l => {
    const server = byLead[l.id] || [];
    const have = {};
    const out = server.map(r => {
      have[r.id] = true;
      return {id:r.id, at:Date.parse(r.called_at)||Date.now(), outcome:r.outcome||null,
              note:r.note||"", synced:true};
    });
    // Calls made on this device that haven't reached the server yet survive.
    l.calls.forEach(c => { if(!c.synced && !have[c.id]) out.push(c); });
    out.sort((a,b) => a.at - b.at);
    l.calls = out;
  });
}

function friendlyError(err){
  if(!err) return "something went wrong";
  const m = String(err.message || err);
  if(err.code === "23505" || /duplicate key/i.test(m)) return "two leads share the same phone number";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "no connection";
  if(err.code === "42501" || /row-level security/i.test(m)) return "the server refused that write";
  if(/JWT|token is expired/i.test(m)) return "session expired — sign in again";
  return m;
}

function pendingCount(){
  const since = db.settings.sync.at || 0;
  let n = db.leads.filter(l => (l.updated||0) > since).length + (db.deleted||[]).length;
  db.leads.forEach(l => l.calls.forEach(c => { if(!c.synced) n++; }));
  return n;
}
function paintSync(){
  const btn = $("#btnSync"); if(!btn) return;
  const cfg = db.settings.sync;
  const n = pendingCount();
  const st = state.sync.busy ? "busy" : state.sync.error ? "error" : n ? "pending" : "ok";
  btn.dataset.s = st;
  btn.title = st==="busy" ? "Syncing…"
    : st==="error" ? "Last sync failed: "+state.sync.error
    : st==="pending" ? n+" change"+(n===1?"":"s")+" waiting — tap to sync"
    : "Everything saved"+(cfg.at?" · "+when(cfg.at):"");
}

async function syncNow(manual){
  if(!me || state.sync.busy) return false;
  const cfg = db.settings.sync;
  state.sync.busy = true; state.sync.error = ""; paintSync();
  const startedAt = Date.now();
  try{
    /* ---- push ---- */
    if((db.deleted||[]).length){
      const { error } = await sb.from("leads").delete().in("id", db.deleted);
      if(error) throw error;
      db.deleted = [];
    }
    const changed = db.leads.filter(l => (l.updated||0) > (cfg.at||0));
    if(changed.length){
      const { error } = await sb.from("leads").upsert(changed.map(leadRow));
      if(error) throw error;
    }
    const calls = [];
    db.leads.forEach(l => l.calls.forEach(c => { if(!c.synced) calls.push(callRow(l, c)); }));
    if(calls.length){
      const { error } = await sb.from("calls").upsert(calls, {onConflict:"id", ignoreDuplicates:true});
      if(error) throw error;
    }
    if((db.scriptsUpdated||0) > (cfg.at||0)){
      const { error } = await sb.from("scripts").upsert(
        db.scripts.map((x,i) => ({id:x.id, user_id:me.id, name:x.name, body:x.body, position:i})));
      if(error) throw error;
    }
    if((db.settings.updated||0) > (cfg.at||0)){
      const s = db.settings;
      const { error } = await sb.from("profiles").upsert({user_id:me.id, display_name:s.me||"",
        company:s.company||"", offer:s.offer||"", theme:s.theme||"auto", script_size:s.scriptSize||18});
      if(error) throw error;
    }

    /* ---- pull ---- */
    const [leadsRes, callsRes, scriptsRes, profRes] = await Promise.all([
      sb.from("leads").select("*"),
      sb.from("calls").select("*").order("called_at", {ascending:false}).limit(2000),
      sb.from("scripts").select("*").order("position"),
      sb.from("profiles").select("*").maybeSingle()
    ]);
    for(const r of [leadsRes, callsRes, scriptsRes, profRes]) if(r.error) throw r.error;

    mergeLeads(leadsRes.data || [], startedAt);
    mergeCalls(callsRes.data || []);
    if((scriptsRes.data||[]).length && (db.scriptsUpdated||0) <= startedAt){
      db.scripts = scriptsRes.data.map(r => ({id:r.id, name:r.name, body:r.body}));
    }
    const prof = profRes.data;
    if(prof && (db.settings.updated||0) <= startedAt){
      db.settings.me = prof.display_name||""; db.settings.company = prof.company||"";
      db.settings.offer = prof.offer||""; db.settings.theme = prof.theme||"auto";
      db.settings.scriptSize = prof.script_size||18;
      applyTheme();
    }

    cfg.at = startedAt;
    save(); render();
    if(manual) toast("Saved — "+db.leads.length+" lead"+(db.leads.length===1?"":"s")+" on your account");
    return true;
  }catch(err){
    state.sync.error = friendlyError(err);
    if(manual) toast("Couldn't sync — "+state.sync.error);
    return false;
  }finally{
    state.sync.busy = false; paintSync();
  }
}

let autoT;
function autoSync(){
  paintSync();
  if(!me) return;
  clearTimeout(autoT);
  autoT = setTimeout(() => syncNow(false), 2500);
}
window.addEventListener("online", () => { if(me && pendingCount()) syncNow(false); });

/* ============================== CSV ============================== */
function parseCSV(text){
  text = text.replace(/^﻿/,"").replace(/\r\n?/g,"\n");
  const delim = (text.split("\n")[0].split("\t").length > text.split("\n")[0].split(",").length) ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += c;
    }else{
      if(c === '"') q = true;
      else if(c === delim){ row.push(cell); cell=""; }
      else if(c === "\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell += c;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== "")).map(r => r.map(x => x.trim()));
}

const GUESS = [
  [/^(business|company|account|dba|org|organi[sz]ation)( ?name)?$|^name$/i, "business"],
  [/first ?name|fname|owner ?first/i, "owner_first"],
  [/last ?name|lname|surname|owner ?last/i, "owner_last"],
  [/owner|contact|principal|poc|decision/i, "owner"],
  [/phone|mobile|cell|tel|number/i, "phone"],
  [/e-?mail/i, "email"],
  [/metro|market|msa|region|dma/i, "metro"],

  [/web|site|url|domain/i, "website"],
  [/value|quote|deal|amount|budget|revenue|price|ticket/i, "value"],
  [/note|comment|remark|detail/i, "note"]
];
function guessField(header, used){
  for(const [re, f] of GUESS){ if(re.test(header) && !used.has(f)) return f; }
  return "";
}
function importModal(){
  openModal("Import leads", `
    <p class="help">Drop a CSV, pick a file, or paste rows straight out of a spreadsheet. First row should be your column headers — you'll map them on the next screen. Leads with a phone number you already have are skipped.</p>
    <div class="drop" id="drop"><b>Drop a CSV here</b>or tap to choose a file</div>
    <textarea class="paste" id="pasteBox" placeholder="business,owner,phone,metro,email
Ridgeline Heating &amp; Air,Dave Kowalski,602-555-0142,Phoenix AZ,dave@ridgelinehvac.com"></textarea>
  `, `<button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mParse">Continue</button>`, () => {
    const drop = $("#drop");
    drop.addEventListener("click", ()=>{ $("#filePick").dataset.mode="csv"; $("#filePick").click(); });
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add("over");}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove("over");}));
    drop.addEventListener("drop", e => {
      const f = e.dataTransfer.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = () => mapModal(parseCSV(r.result)); r.readAsText(f);
    });
    $("#mCancel").addEventListener("click", closeModal);
    $("#mParse").addEventListener("click", () => {
      const txt = $("#pasteBox").value.trim();
      if(!txt){ toast("Paste some rows or choose a file first"); return; }
      mapModal(parseCSV(txt));
    });
  });
}
$("#filePick").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const mode = e.target.dataset.mode;
  const r = new FileReader();
  r.onload = () => {
    if(mode==="script"){ addScript(f.name.replace(/\.[^.]+$/,""), r.result); }
    else if(mode==="json"){ restore(r.result); }
    else mapModal(parseCSV(r.result));
  };
  r.readAsText(f); e.target.value = "";
});
function mapModal(rows){
  if(rows.length < 2){ toast("Need a header row plus at least one lead"); return; }
  const head = rows[0], body = rows.slice(1), used = new Set();
  const guesses = head.map(h => { const g = guessField(h, used); if(g) used.add(g); return g; });
  const opts = f => FIELDS.map(([v,l]) => `<option value="${v}" ${v===f?"selected":""}>${esc(l)}</option>`).join("");
  openModal("Match your columns", `
    <p class="help">${body.length} row${body.length===1?"":"s"} found. Point each column at a field — anything set to “skip” is ignored.</p>
    <div id="maprows">${head.map((h,i)=>`<div class="maprow"><div class="src">${esc(h||"(column "+(i+1)+")")}</div>
      <select data-i="${i}">${opts(guesses[i])}</select></div>`).join("")}</div>
    <div class="preview" id="mapPrev"></div>
  `, `<button class="btn" id="mBack">Back</button><button class="btn primary" id="mDo">Import ${body.length}</button>`, () => {
    const prev = () => {
      const m = {}; $$("#maprows select").forEach(s => { if(s.value) m[s.value] = +s.dataset.i; });
      const sample = body.slice(0,2).map(r => {
        const l = rowToLead(r, m);
        return esc([l.business, l.owner, fmtPhone(l.phone), l.metro].filter(Boolean).join("  \u00b7  "));
      }).filter(Boolean).join("<br />");
      $("#mapPrev").innerHTML = sample ? "Preview<br />"+sample : "Nothing mapped yet";
    };
    $$("#maprows select").forEach(s => s.addEventListener("change", prev)); prev();
    $("#mBack").addEventListener("click", importModal);
    $("#mDo").addEventListener("click", () => {
      const m = {}; $$("#maprows select").forEach(s => { if(s.value) m[s.value] = +s.dataset.i; });
      if(m.phone===undefined && m.business===undefined){ toast("Map at least a business name or a phone number"); return; }
      const have = new Set(db.leads.map(l => l.phone).filter(Boolean));
      let added = 0, skipped = 0;
      body.forEach(r => {
        const o = rowToLead(r, m);
        if(!o.business && !o.phone) return;
        if(o.phone && have.has(o.phone)){ skipped++; return; }
        if(o.phone) have.add(o.phone);
        db.leads.push(mkLead(o)); added++;
      });
      save(); render(); closeModal(); autoSync();
      toast(`Imported ${added}${skipped?` · skipped ${skipped} duplicate${skipped===1?"":"s"}`:""}`);
    });
  });
}
function rowToLead(r, m){
  const g = k => m[k]!==undefined ? (r[m[k]]||"").trim() : "";
  const owner = [g("owner"), [g("owner_first"), g("owner_last")].filter(Boolean).join(" ")].filter(Boolean)[0] || "";
  return {business:g("business"), owner:owner, phone:normPhone(g("phone")), email:g("email"),
          metro:g("metro"), location:g("location"), website:g("website"), value:parseMoney(g("value")),
          note:g("note"), status:"new"};
}

  save(); autoSync(); scriptsModal(); toast("Script added");
}
function scriptsModal(){
  openModal("Call scripts", `
    <div class="slist">${db.scripts.map(s=>`<div class="srow"><span class="nm">${esc(s.name)}</span>

    <p class="help">Scripts show up in the call sheet while you're on the phone. Use tokens and they fill in from the lead — highlighted so you can see them at a glance.</p>

  `, `<button class="btn" id="sFile">Import .txt</button><button class="btn primary" id="sNew">New script</button>`, () => {
    $("#sNew").addEventListener("click", ()=>editScript(null));

    $$("[data-edit]").forEach(b=>b.addEventListener("click", ()=>editScript(b.dataset.edit)));

function editScript(id){
  const s = db.scripts.find(x=>x.id===id) || {name:"", body:""};
  openModal(id?"Edit script":"New script", `
    <div class="fields">
      <div class="f"><label for="s_name">Script name</label><input id="s_name" value="${esc(s.name)}" placeholder="Cold call — roofing" /></div>

    </div>

/* ============================== table view ==============================
   The spreadsheet replacement: sort, filter, edit in place, bulk-change.  */

const COLS = [
  {k:"business", t:"Business",  w:200},
  {k:"owner",    t:"Owner",     w:150},
  {k:"phone",    t:"Phone",     w:140, cls:"mono"},
  {k:"metro",    t:"Metro",     w:130},
  {k:"location", t:"City",      w:120},
  {k:"email",    t:"Email",     w:190},
  {k:"status",   t:"Status",    w:120},
  {k:"value",    t:"Deal",      w:90,  cls:"num"},
  {k:"followAt", t:"Follow up", w:110},
  {k:"nCalls",   t:"Calls",     w:60,  cls:"num", ro:true}
];
let grid = {sort:"business", dir:1, q:"", sel:new Set(), edit:null};

function gridRows(){
  const q = grid.q.trim().toLowerCase();
  let rows = db.leads.slice();
  if(q){
    const qd = q.replace(/\D/g,"");
    rows = rows.filter(l =>
      (l.business+" "+l.owner+" "+l.metro+" "+l.location+" "+l.email).toLowerCase().includes(q) ||
      (qd && l.phone.replace(/\D/g,"").includes(qd)));
  }
  const k = grid.sort;
  rows.sort((a,b) => {
    let x, y;
    if(k === "nCalls"){ x = a.calls.length; y = b.calls.length; }
    else if(k === "value"){ x = +a.value||0; y = +b.value||0; }
    else if(k === "status"){ x = (STATUS[a.status]||{}).label||""; y = (STATUS[b.status]||{}).label||""; }
    else { x = a[k]; y = b[k]; }
    if(typeof x === "number" && typeof y === "number") return (x-y) * grid.dir;
    x = String(x==null?"":x).toLowerCase(); y = String(y==null?"":y).toLowerCase();
    if(!x && y) return 1;                       // blanks sink, either direction
    if(x && !y) return -1;
    return x < y ? -grid.dir : x > y ? grid.dir : 0;
  });
  return rows;
}
function gridCell(l, c){
  if(c.k === "nCalls") return String(l.calls.length);
  if(c.k === "value")  return l.value ? money(l.value) : "";
  if(c.k === "phone")  return fmtPhone(l.phone);
  if(c.k === "status"){
    const st = STATUS[l.status] || STATUS.new;
    return `<span class="pill" style="--sc:${st.color}">${esc(st.label)}</span>`;
  }
  return esc(l[c.k] || "");
}
function paintGrid(){
  const rows = gridRows();
  const head = `<tr><th class="plain chk"><input type="checkbox" id="gAll" aria-label="Select all" /></th>` +
    COLS.map(c => `<th data-sort="${c.k}" style="min-width:${c.w}px">${esc(c.t)}${grid.sort===c.k?`<span class="ar">${grid.dir>0?"↑":"↓"}</span>`:""}</th>`).join("") +
    `<th class="plain act"></th></tr>`;
  const body = rows.map(l => `<tr data-id="${l.id}" class="${grid.sel.has(l.id)?"on":""}">
      <td class="chk"><input type="checkbox" data-sel="${l.id}" ${grid.sel.has(l.id)?"checked":""} aria-label="Select ${esc(l.business)}" /></td>` +
    COLS.map(c => `<td class="${c.cls||""}"><span class="cell" ${c.ro?"":`data-edit="${l.id}" data-k="${c.k}"`}>${gridCell(l,c)}</span></td>`).join("") +
    `<td class="act"><a class="dialmini" href="tel:${esc(l.phone)}" target="_blank" rel="noopener" data-dial="${l.id}" aria-label="Call ${esc(l.business)}"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 1.9c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .7-.2 1L6.6 10.8z"/></svg></a></td>
    </tr>`).join("");

  $("#gridWrap").innerHTML = rows.length
    ? `<table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table>`
    : `<p class="help" style="padding:26px;text-align:center;margin:0">No leads match. Clear the search, or import a CSV.</p>`;

  const n = grid.sel.size;
  $("#selBar").innerHTML = n ? `<b>${n}</b> selected
      <span class="spacer"></span>
      <select id="gStatus"><option value="">Set status…</option>${Object.keys(STATUS).map(k=>`<option value="${k}">${STATUS[k].label}</option>`).join("")}</select>
      <button id="gClear">Clear</button>
      <button class="danger" id="gDel">Delete ${n}</button>` : "";
  $("#selBar").classList.toggle("hide", !n);
  paintFoot(rows.length);
}
function paintFoot(shown){
  const el = $("#gridFoot"); if(!el) return;
  const n = shown === undefined ? gridRows().length : shown;
  el.innerHTML = `<span>${n} of ${db.leads.length} lead${db.leads.length===1?"":"s"}</span>
    <span>${esc(money(db.leads.filter(l=>OPEN_VALUE.includes(l.status)).reduce((t,l)=>t+(+l.value||0),0)))} open pipeline</span>`;
}
function startEdit(span){
  if(grid.edit) return;
  const l = db.leads.find(x => x.id === span.dataset.edit); if(!l) return;
  const k = span.dataset.k;
  const td = span.parentNode;
  grid.edit = {id:l.id, k:k};
  let input;
  if(k === "status"){
    input = document.createElement("select");
    input.innerHTML = Object.keys(STATUS).map(s=>`<option value="${s}" ${l.status===s?"selected":""}>${STATUS[s].label}</option>`).join("");
  }else{
    input = document.createElement("input");
    input.type  = k === "followAt" ? "date" : "text";
    input.value = k === "value" ? (l.value || "") : (l[k] || "");
    if(k === "value") input.inputMode = "decimal";
    if(k === "phone") input.type = "tel";
  }
  td.classList.add("editing"); td.innerHTML = ""; td.appendChild(input);
  input.focus(); if(input.select) input.select();

  const commit = (moveOn) => {
    if(!grid.edit) return;
    grid.edit = null;
    const v = input.value;
    const before = l[k];
    if(k === "value")        l.value    = parseMoney(v);
    else if(k === "phone")   l.phone    = normPhone(v);
    else if(k === "status")  l.status   = v;
    else if(k === "followAt")l.followAt = v || "";
    else                     l[k]       = v.trim();
    const changed = k === "value" ? before !== l.value : String(before||"") !== String(l[k]||"");
    // Repaint just this cell. Repainting the table here would destroy the
    // element the next click is travelling towards, swallowing that click,
    // and would re-sort rows out from under the cursor mid-edit.
    td.classList.remove("editing");
    td.innerHTML = `<span class="cell" data-edit="${l.id}" data-k="${k}">${gridCell(l, COLS.find(c=>c.k===k))}</span>`;
    if(changed){ touch(l); save(); autoSync(); paintFoot(); }
    if(moveOn){
      const next = $(`#gridWrap tr[data-id="${l.id}"] + tr [data-k="${k}"]`);
      if(next) startEdit(next);
    }
  };
  input.addEventListener("blur", () => commit(false));
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); commit(true); }
    if(e.key === "Escape"){ e.preventDefault(); grid.edit = null; td.classList.remove("editing"); paintGrid(); }
  });
  if(k === "status") input.addEventListener("change", () => commit(false));
}
function tableModal(){
  grid.sel.clear(); grid.edit = null;
  openModal("All leads", `
    <div class="tbar">
      <input type="search" id="gQ" placeholder="Search leads" value="${esc(grid.q)}" autocomplete="off" />
      <button class="tool" id="gAdd">Add lead</button>
      <button class="tool" id="gImport">Import CSV</button>
    </div>
    <div class="selbar hide" id="selBar"></div>
    <div class="tscroll" id="gridWrap" style="max-height:calc(94dvh - 230px)"></div>
    <div class="tfoot" id="gridFoot"></div>
    <p class="help" style="margin:12px 0 0">Tap any cell to change it. Enter saves and drops to the row below, Escape cancels. Everything saves to your account.</p>
  `, `<button class="btn primary" id="gDone" style="flex:1">Done</button>`, () => {
    modal.classList.add("wide");
    paintGrid();
    $("#gDone").addEventListener("click", () => { modal.classList.remove("wide"); closeModal(); render(); });
    $("#gQ").addEventListener("input", e => { grid.q = e.target.value; paintGrid(); });
    $("#gAdd").addEventListener("click", () => { modal.classList.remove("wide"); addModal(); });
    $("#gImport").addEventListener("click", () => { modal.classList.remove("wide"); importModal(); });
    $("#gridWrap").addEventListener("click", e => {
      const th = e.target.closest("th[data-sort]");
      if(th){
        if(grid.sort === th.dataset.sort) grid.dir = -grid.dir; else { grid.sort = th.dataset.sort; grid.dir = 1; }
        paintGrid(); return;
      }
      const all = e.target.closest("#gAll");
      if(all){
        const rows = gridRows();
        if(grid.sel.size === rows.length) grid.sel.clear();
        else rows.forEach(l => grid.sel.add(l.id));
        paintGrid(); return;
      }
      const box = e.target.closest("[data-sel]");
      if(box){
        const id = box.dataset.sel;
        grid.sel.has(id) ? grid.sel.delete(id) : grid.sel.add(id);
        paintGrid(); return;
      }
      if(e.target.closest("[data-dial]")) return;      // let the call sheet open
      const span = e.target.closest("[data-edit]");
      if(span) startEdit(span);
    });
    $("#selBar").addEventListener("click", async e => {
      if(e.target.id === "gClear"){ grid.sel.clear(); paintGrid(); return; }
      if(e.target.id === "gDel"){
        const ids = Array.from(grid.sel);
        if(!confirm("Delete "+ids.length+" lead"+(ids.length===1?"":"s")+" and their call history?")) return;
        db.leads = db.leads.filter(l => ids.indexOf(l.id) === -1);
        db.deleted.push.apply(db.deleted, ids);
        grid.sel.clear(); save(); autoSync(); paintGrid();
        toast("Deleted "+ids.length);
      }
    });
    $("#selBar").addEventListener("change", e => {
      if(e.target.id !== "gStatus" || !e.target.value) return;
      const st = e.target.value;
      db.leads.forEach(l => { if(grid.sel.has(l.id)){ l.status = st; touch(l); } });
      save(); autoSync(); paintGrid();
      toast("Set "+grid.sel.size+" to "+STATUS[st].label);
    });
  });
}

/* ============================== export / settings ============================== */
function csvCell(v){ v = String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function leadsCSV(){
  const head = ["business","owner","phone","email","metro","location","website","deal_value","status","follow_up","calls","last_call","last_note"];
  const rows = db.leads.map(l => {
    const last = l.calls[l.calls.length-1];
    return [l.business,l.owner,l.phone,l.email,l.metro,l.location,l.website,l.value||"",(STATUS[l.status]||{}).label||l.status,
      l.followAt, l.calls.length, last?new Date(last.at).toISOString():"", last?last.note:""];
  });
  return [head, ...rows].map(r => r.map(csvCell).join(",")).join("\n");
}
function logCSV(){
  const head = ["when","business","owner","phone","metro","outcome","deal_value","note"];
  const rows = [];
  db.leads.forEach(l => l.calls.forEach(c => rows.push([new Date(c.at).toISOString(), l.business, l.owner, l.phone, l.metro,
    (STATUS[c.outcome]||{}).label||"Dialed", l.value||"", c.note])));
  rows.sort((a,b)=> a[0]<b[0]?1:-1);
  return [head, ...rows].map(r => r.map(csvCell).join(",")).join("\n");
}
function exportModal(kind){
  const text = kind==="log" ? logCSV() : kind==="json" ? JSON.stringify(db,null,2) : leadsCSV();
  const title = kind==="log" ? "Call log" : kind==="json" ? "Backup" : "Leads";
  openModal("Export — "+title, `
    <div class="toolbar" style="padding:0 0 12px">
      <button class="tool ${kind!=="log"&&kind!=="json"?"go":""}" data-x="leads">Leads CSV</button>
      <button class="tool ${kind==="log"?"go":""}" data-x="log">Call log CSV</button>
      <button class="tool ${kind==="json"?"go":""}" data-x="json">Full backup</button>
    </div>
    <p class="help">Copy this straight into a spreadsheet, or save it as a file. Keep a backup — everything lives in this browser only.</p>
    <textarea class="paste" id="xText" style="min-height:200px" readonly>${esc(text)}</textarea>
  `, `<button class="btn" id="xDown">Save file</button><button class="btn primary" id="xCopy">Copy</button>`, () => {
    $("#mBody").addEventListener("click", e => { const b = e.target.closest("[data-x]"); if(b) exportModal(b.dataset.x); });
    $("#xCopy").addEventListener("click", async () => {
      const ta = $("#xText"); ta.select();
      try{ await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
      catch(e){ document.execCommand("copy"); toast("Copied"); }
    });
    $("#xDown").addEventListener("click", async () => {
      const name = kind==="json" ? "dial-sheet-backup.json" : kind==="log" ? "call-log.csv" : "leads.csv";
      // Hosted viewers hand the file over through their own save prompt.
      if(window.claude && typeof window.claude.use === "function"){
        const dl = await window.claude.use("downloads").catch(()=>null);
        if(!dl){ toast("Saving isn't available here — use Copy"); return; }
        try{ await dl.save({filename:name, data:text}); toast("Saved"); }
        catch(err){
          if(err && err.code === "extension_not_enabled"){
            try{ await dl.save({filename:name.replace(/\.csv$/,".txt"), data:text}); toast("Saved as .txt"); return; }
            catch(e2){ err = e2; }
          }
          if(!err || err.code !== "declined") toast("Couldn't save — use Copy instead");
        }
        return;
      }
      const blob = new Blob([text], {type: kind==="json"?"application/json":"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Saving… if nothing downloads, use Copy instead");
    });
  });
}
function restore(text){
  try{
    const d = JSON.parse(text);
    if(!d.leads) throw 0;
    db = {v:1, leads:d.leads.map(mkLead), scripts:d.scripts&&d.scripts.length?d.scripts:blank().scripts,
          settings:Object.assign(blank().settings, d.settings||{})};
    save(); applyTheme(); render(); closeModal(); toast("Backup restored");
  }catch(e){ toast("That file didn't look like a backup"); }
}
function settingsModal(){
  const s = db.settings;
  openModal("Settings", `
    <div class="fields">
      <div class="f"><label for="p_me">Your name</label><input id="p_me" value="${esc(s.me)}" placeholder="Used in scripts as {{me}}" /></div>
      <div class="f"><label for="p_company">Your company</label><input id="p_company" value="${esc(s.company)}" placeholder="Used as {{company}}" /></div>
      <div class="f"><label for="p_offer">Your one-liner</label><textarea id="p_offer" rows="3" placeholder="Used as {{offer}}">${esc(s.offer)}</textarea></div>
      <div class="f"><label for="p_theme">Appearance</label><select id="p_theme">
        <option value="auto" ${s.theme==="auto"?"selected":""}>Match my device</option>
        <option value="light" ${s.theme==="light"?"selected":""}>Light</option>
        <option value="dark" ${s.theme==="dark"?"selected":""}>Dark</option></select></div>
    </div>
    <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px">Account</h3>
    <p class="help">Signed in as <b style="color:var(--ink)">${esc(me ? me.email : "")}</b>. Your leads, calls and scripts live on your account — sign in on any phone or computer and they're there. Nobody else can see them.</p>
    <p class="help" id="syncState" style="margin-top:-4px"></p>
    <div class="toolbar" style="padding:0">
      <button class="tool" id="pSync">Sync now</button>
      <button class="tool" id="pPass">Change password</button>
      <button class="tool" id="pOut">Sign out</button>
    </div>
    <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px">Your data</h3>
    <p class="help">Export whenever you like — it's your list. Erasing wipes this account's leads and call history everywhere, not just on this device.</p>
    <div class="toolbar" style="padding:0">
      <button class="tool" id="pExport">Export</button>
      <button class="tool" id="pWipe" style="color:var(--brick)">Erase everything</button>
    </div>
  `, `<button class="btn primary" id="pSave" style="flex:1">Done</button>`, () => {
    const saveSettings = () => {
      s.me = $("#p_me").value.trim(); s.company = $("#p_company").value.trim();
      s.offer = $("#p_offer").value.trim(); s.theme = $("#p_theme").value;
      s.updated = Date.now();
      save(); applyTheme(); autoSync();
    };
    const paintState = () => {
      const el = $("#syncState"); if(!el) return;
      el.innerHTML = state.sync.busy ? "Saving…"
        : state.sync.error ? `<span style="color:var(--brick)">Last sync failed — ${esc(state.sync.error)}</span>`
        : s.sync.at ? `Last saved ${esc(when(s.sync.at))} · ${(n=>n?n+" change"+(n===1?"":"s")+" waiting":"everything up to date")(pendingCount())}`
        : "Not synced yet.";
    };
    paintState();
    $("#pSave").addEventListener("click", () => { saveSettings(); closeModal(); toast("Saved"); });
    $("#pSync").addEventListener("click", async () => {
      saveSettings(); paintState();
      await syncNow(true);
      paintState(); render();
    });
    $("#pOut").addEventListener("click", async () => {
      const waiting = pendingCount();
      if(waiting && !confirm(waiting+" change"+(waiting===1?"":"s")+" haven't reached your account yet. Sign out and lose them?")) return;
      try{ localStorage.removeItem(cacheKey()); }catch(e){}   // leave nothing behind on a shared device
      await sb.auth.signOut();
      closeModal(); signedOut();
    });
    $("#pPass").addEventListener("click", async () => {
      const next = prompt("New password (at least 8 characters)");
      if(next === null) return;
      if(String(next).length < 8){ toast("Too short — 8 characters minimum"); return; }
      const { error } = await sb.auth.updateUser({password:next});
      toast(error ? "Couldn't change it — "+friendlyError(error) : "Password changed");
    });
    $("#pExport").addEventListener("click", () => exportModal("leads"));
    $("#p_theme").addEventListener("change", e => { s.theme = e.target.value; applyTheme(); });
    $("#pWipe").addEventListener("click", async ()=>{
      if(!confirm("Erase every lead and call on this account, on all devices? Export first — this cannot be undone.")) return;
      if(!confirm("Last check: really erase " + db.leads.length + " leads and their call history?")) return;
      const { error } = await sb.from("leads").delete().eq("user_id", me.id);
      if(error){ toast("Couldn't erase — "+friendlyError(error)); return; }
      db.leads = []; db.deleted = []; db.settings.sync.ids = [];
      save(); render(); closeModal(); toast("Erased");
    });
  });
}
function applyTheme(){
  const t = db.settings.theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* ============================== boot ============================== */
$("#btnImport").addEventListener("click", importModal);
$("#btnAdd").addEventListener("click", addModal);
$("#btnScripts").addEventListener("click", scriptsModal);
$("#btnTable").addEventListener("click", tableModal);
$("#btnExport").addEventListener("click", ()=>exportModal("leads"));
$("#btnSettings").addEventListener("click", settingsModal);
$("#btnSync").addEventListener("click", ()=>syncNow(true));
window.addEventListener("beforeunload", save);

/* ---------------------------------------------------------- sign in ---- */

let gateMode = "in";

function authMessage(err){
  const m = String((err && err.message) || err || "");
  if(/Invalid login credentials/i.test(m))       return "That email and password don't match an account.";
  if(/already registered|already been registered/i.test(m)) return "That email already has an account. Sign in instead.";
  if(/Password should be at least/i.test(m))     return "Password needs at least 6 characters.";
  if(/valid email|email_address_invalid/i.test(m)) return "That doesn't look like a real email address.";
  if(/Email not confirmed/i.test(m))             return "Check your email and confirm the account first.";
  if(/rate limit|too many/i.test(m))             return "Too many tries. Wait a minute and go again.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "No connection.";
  return m || "That didn't work.";
}
function gateBusy(on, label){
  const b = $("#gateGo");
  b.disabled = on;
  b.textContent = on ? (label||"Working…") : (gateMode==="in" ? "Sign in" : "Create account");
}
function setGateMode(mode){
  gateMode = mode;
  const up = mode === "up";
  $("#gateTitle").textContent = up ? "Create your account" : "Dial Sheet";
  $("#gateSub").textContent   = up ? "Your list, your calls, on every device."
                                   : "Sign in to your list.";
  $("#gateGo").textContent    = up ? "Create account" : "Sign in";
  $("#gateSwap").textContent  = up ? "I already have an account" : "Create an account";
  $("#gPass").setAttribute("autocomplete", up ? "new-password" : "current-password");
  $("#gateReset").classList.toggle("hide", up);
  $("#gateErr").textContent = "";
}
function signedOut(){
  me = null; db = blank();
  $("#booting").hidden = true;
  $("#gate").hidden = false;
  $("#gPass").value = "";
  setGateMode("in");
  document.body.style.overflow = "hidden";
}
function signedIn(user){
  const fresh = !me || me.id !== user.id;
  me = user;
  if(fresh) db = load();
  $("#gate").hidden = true;
  $("#booting").hidden = true;
  document.body.style.overflow = "";
  applyTheme(); render();
  syncNow(false);
}

$("#gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#gEmail").value.trim(), pass = $("#gPass").value;
  if(!email || !pass){ $("#gateErr").textContent = "Email and password, both."; return; }
  $("#gateErr").textContent = "";
  gateBusy(true, gateMode==="in" ? "Signing in…" : "Creating…");
  try{
    if(gateMode === "in"){
      const { error } = await sb.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
    }else{
      const { data, error } = await sb.auth.signUp({email, password:pass});
      if(error) throw error;
      if(!data.session){
        $("#gateErr").style.color = "var(--pine)";
        $("#gateErr").textContent = "Account created. Check your email for the confirmation link, then sign in.";
        setTimeout(()=>{ $("#gateErr").style.color = ""; setGateMode("in"); }, 6000);
      }
    }
  }catch(err){
    $("#gateErr").textContent = authMessage(err);
  }finally{
    gateBusy(false);
  }
});
$("#gateSwap").addEventListener("click", () => setGateMode(gateMode==="in" ? "up" : "in"));
$("#gateReset").addEventListener("click", async () => {
  const email = $("#gEmail").value.trim();
  if(!email){ $("#gateErr").textContent = "Type your email first, then tap this."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href});
  $("#gateErr").style.color = error ? "" : "var(--pine)";
  $("#gateErr").textContent = error ? authMessage(error) : "Reset link sent. Check your email.";
});

sb.auth.onAuthStateChange(async (event, session) => {
  if(event === "SIGNED_OUT") return signedOut();
  if(event === "PASSWORD_RECOVERY"){
    const next = prompt("Set a new password (at least 8 characters)");
    if(next && String(next).length >= 8){
      const { error } = await sb.auth.updateUser({password:next});
      toast(error ? authMessage(error) : "Password updated");
    }
  }
  if(session && session.user) signedIn(session.user);
});

(async function start(){
  applyTheme();
  try{
    const res = await Promise.race([
      sb.auth.getSession(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("the server didn't answer")), 12000))
    ]);
    if(res && res.data && res.data.session) signedIn(res.data.session.user);
    else signedOut();
  }catch(err){
    // Better to offer the sign-in screen than to sit on a spinner.
    signedOut();
    $("#gateErr").textContent = "Couldn't reach the server (" + friendlyError(err) + "). Check your connection and try signing in.";
  }
})();
})();
</script>
</body>
